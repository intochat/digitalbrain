version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pub
    directories:
      - /clients/digitalbrain_wire
      - /clients/digitalbrain_flutter
      - /clients/digitalbrain_flutter/shell
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dart:
        patterns:
          - '*'

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    groups:
      aspire:
        patterns:
          - 'Aspire.*'
          - 'CommunityToolkit.Aspire.*'
      microsoft-extensions:
        patterns:
          - 'Microsoft.Extensions.*'
      microsoft-orleans:
        patterns:
          - 'Microsoft.Orleans.*'
          - 'Orleans.*'
      test-stack:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
