syntax = "proto3";

package ino.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Ino.Grpc";

// Wire contract consumed by POC/clients/ino.flutter. Keep the service shape
// in lockstep with POC/clients/ino.flutter/protos/ino.proto — both are copies
// of the same contract, split only because dart + dotnet pull their own
// toolchains from different paths. Slice 1 implements Chat(); the other
// RPCs auto-return UNIMPLEMENTED from the generated base class until later
// slices override them.
service Ino {
  rpc Chat(ChatRequest) returns (stream ChatResponse);
  rpc StreamEvents(EventSubscription) returns (stream InoEvent);
  rpc StreamPersonaState(PersonaSubscription) returns (stream PersonaState);
  rpc FireSynapse(FireRequest) returns (FireResponse);
  rpc GetTimeline(TimelineQuery) returns (stream TimelineEvent);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc InstallSkill(InstallSkillRequest) returns (InstallSkillResponse);
  rpc GetSkillUI(SkillUIRequest) returns (SkillUIResponse);
  rpc SwitchPersona(SwitchPersonaRequest) returns (SwitchPersonaResponse);
  rpc GetTelemetry(TelemetryRequest) returns (TelemetryResponse);
  rpc GetJournal(JournalRequest) returns (JournalResponse);
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
  rpc GetReasoning(ReasoningRequest) returns (ReasoningResponse);
  // Inspector E.3 — Slice 3B: proposal lifecycle + routing decisions
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  rpc DecideProposal(DecideProposalRequest) returns (DecideProposalResponse);
  rpc ListRoutingDecisions(ListRoutingDecisionsRequest) returns (ListRoutingDecisionsResponse);
  // Slice 4 — RFW two-way callbacks: client fires this when a remote widget
  // tree dispatches an event (FlightCard's onSelect, etc.); the gateway
  // resolves the correlation_id back to the originating plan grain and
  // dispatches via IRfwEventHandler.HandleRfwEventAsync.
  rpc RfwEvent(RfwEventRequest) returns (RfwEventResponse);
  // Slice C.1 — single-shot natural-language entry. Returns one InoResponse
  // (no streaming, no skeleton frames). Used by the MCP server (next slice)
  // and by integration tests. Chat() stays for the Flutter client.
  rpc AskIno(AskInoRequest) returns (AskInoResponse);
  // Slice C.3 — server-streaming brain pulse subscription. Every grain call
  // cluster-wide emits one BrainPulseProto frame. Used by the Flutter brain
  // screen (UI render lands in C.4); for C.3 the client just logs.
  rpc WatchBrainActivity(BrainWatchRequest) returns (stream BrainPulseProto);
  // Slice C.4 — fire a synapse from the inspector "Fire test synapse" affordance.
  // The gateway resolves the synapse type via Discovery and delegates to the
  // existing fire pipeline; payload_json is deserialized into the resolved
  // synapse type before dispatch.
  rpc FireTestSynapse(FireTestSynapseRequest) returns (FireTestSynapseResponse);
}

message ChatRequest {
  string message = 1;
  string user_id = 2;
  // Conversation handle for clarification round-trips. Empty on first turn —
  // the server generates a fresh id and echoes it back in ChatResponse. The
  // client caches it and supplies it on follow-up turns so the gateway routes
  // continuations to the same conversation-bearing grain activation
  // (TripPlannerNeuron uses correlation_id as its grain primary key).
  string correlation_id = 3;
}

message ChatResponse {
  string reply = 1;
  string neuron_id = 2;
  bytes rfw_description = 3;
  bytes rfw_data = 4;
  string content_type = 5;
  // Skeleton-phase response: the gateway emits an immediate placeholder with
  // the final card shape but empty data so clients can paint a skeleton UI
  // while the real neuron handler runs. The final (non-skeleton) response on
  // the same stream carries the populated RFW data. See
  // FlightCardTemplate.BuildSkeleton for the placeholder shape.
  bool is_skeleton = 6;
  // Always populated by the gateway. The client caches this and sends it back
  // on the next ChatRequest / FireRequest to keep the conversation pinned to
  // the same grain activation.
  string correlation_id = 7;
}

message EventSubscription {
  string user_id = 1;
  repeated string event_types = 2;
}

message InoEvent {
  string type = 1;
  string source_neuron = 2;
  bytes payload = 3;
  int64 timestamp = 4;
}

message PersonaSubscription {
  string user_id = 1;
}

message PersonaState {
  string emotion = 1;
  float energy = 2;
  float confidence = 3;
  map<string, float> domain_affinity = 4;
}

message FireRequest {
  string verb = 1;
  map<string, string> args = 2;
  string target_neuron = 3;
  // Conversation handle. Required for verbs that continue an in-flight
  // conversation (e.g. ino.core.provide-clarification) — the gateway uses
  // it as the grain primary key so the fire lands on the same activation
  // that asked the question.
  string correlation_id = 4;
  string user_id = 5;
}

message FireResponse {
  bool ok = 1;
  string synapse_id = 2;
  // Same shape as the chat-stream frames — when the fired synapse returns a
  // payload that implements IHasRfwPayload (next AskClarification, or the
  // final itinerary), the gateway shapes it into these fields so the Flutter
  // client can render it inline as the next chat message without a separate
  // streaming round-trip.
  string reply = 3;
  bytes rfw_description = 4;
  bytes rfw_data = 5;
  string content_type = 6;
  string correlation_id = 7;
}

message TimelineQuery {
  int32 limit = 1;
  int32 min_decay = 2;
}

message TimelineEvent {
  int64 sequence = 1;
  string kind = 2;
  string source = 3;
  string target = 4;
  int64 timestamp = 5;
  int32 decay = 6;
}

message ListSkillsRequest {
  string domain = 1;
  string query = 2;
}

message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}

message SkillInfo {
  string id = 1;
  string name = 2;
  string domain = 3;
  string description = 4;
  bool installed = 5;
  repeated string capabilities = 6;
}

message InstallSkillRequest {
  string skill_id = 1;
}

message InstallSkillResponse {
  bool ok = 1;
  string neuron_id = 2;
}

message SkillUIRequest {
  string skill_id = 1;
}

message SkillUIResponse {
  bytes rfw_description = 1;
  bytes rfw_data = 2;
}

message SwitchPersonaRequest {
  string persona_name = 1;
}

message SwitchPersonaResponse {
  string persona_slug = 1;
  string persona_name = 2;
  string rive_asset_url = 3;
  bool is_generating = 4;
  map<string, string> traits = 5;
}

message TelemetryRequest {
  string query = 1;
  int32 limit = 2;
}

message TelemetryEntry {
  string label = 1;
  double value = 2;
}

message TelemetryResponse {
  string chart_type = 1;
  string title = 2;
  string summary = 3;
  repeated TelemetryEntry entries = 4;
}

message JournalRequest {
  string neuron_id = 1;
  int32 limit = 2;
}

message JournalEntry {
  int64 timestamp = 1;
  string kind = 2;
  string synapse_verb = 3;
  string correlation_id = 4;
  string source_neuron = 5;
  string target_neuron = 6;
}

message JournalResponse {
  repeated JournalEntry entries = 1;
}

message MetricsRequest {
  string neuron_id = 1;
}

message NeuronMetric {
  string neuron_id = 1;
  int64 fire_count = 2;
  int64 broadcast_count = 3;
  int64 last_activated_unix_ms = 4;
}

message MetricsResponse {
  repeated NeuronMetric per_neuron = 1;
}

message ReasoningRequest {
  string neuron_id = 1;
}

message ReasoningResponse {
  string neuron_id = 1;
  string source = 2;
  string scenario_name = 3;
  string text = 4;
}

// Inspector E.3 — Slice 3B: enums, messages for proposals + routing decisions

enum ProposalStatusProto {
  PROPOSAL_STATUS_PENDING = 0;
  PROPOSAL_STATUS_APPROVED = 1;
  PROPOSAL_STATUS_REJECTED = 2;
}

enum RoutingSourceProto {
  ROUTING_SOURCE_UNROUTED = 0;
  ROUTING_SOURCE_REGEX = 1;
  ROUTING_SOURCE_ML = 2;
  ROUTING_SOURCE_LLM = 3;
}

message ListProposalsRequest {
  string user_id = 1;
  optional ProposalStatusProto filter = 2;
  int32 skip = 3;
  int32 take = 4;
}

message ProposalView {
  string proposal_id = 1;
  string cluster_key = 2;
  string example_prompt = 3;
  int32 occurrences = 4;
  google.protobuf.Timestamp proposed_at = 5;
  ProposalStatusProto status = 6;
  optional string activated_neuron_id = 7;
  optional google.protobuf.Timestamp decided_at = 8;
}

message ListProposalsResponse {
  repeated ProposalView entries = 1;
}

message DecideProposalRequest {
  string user_id = 1;
  string proposal_id = 2;
  ProposalStatusProto decision = 3;       // APPROVED or REJECTED
  optional string override_script_body = 4;  // reserved for future UI
}

message DecideProposalResponse {
  bool accepted = 1;
}

message ListRoutingDecisionsRequest {
  string user_id = 1;
  int32 count = 2;     // server caps at 20
}

message RoutingDecisionView {
  string prompt = 1;
  RoutingSourceProto source = 2;
  optional string neuron_id = 3;
  optional double confidence = 4;
  google.protobuf.Timestamp at = 5;
  optional double ml_prediction = 6;
  optional double ml_confidence = 7;
  bool llm_called = 8;
  int32 routing_duration_ms = 9;
  string correlation_id = 10;
}

message ListRoutingDecisionsResponse {
  repeated RoutingDecisionView entries = 1;
}

// Slice 4 — RFW event callback. map<string, string> over Struct for simpler
// Dart codegen — every event we emit (flight.selected, hotel.selected,
// place.selected) carries string-typed args (flightId, hotelId, placeId).
message RfwEventRequest {
  string correlation_id = 1;
  string event_name = 2;
  map<string, string> args = 3;
}

// The plan's reply rides back inline — the Flutter client appends the new
// reply to the chat thread as a fresh message. This sidesteps the need for
// a server-push channel into the open Chat() bidi stream for v0.1.
message RfwEventResponse {
  bool accepted = 1;
  string reply = 2;
  bytes rfw_description = 3;
  bytes rfw_data = 4;
  string content_type = 5;
  string correlation_id = 6;
}

message AskInoRequest {
  string prompt = 1;
  string user_id = 2;
  string session_id = 3;
  string correlation_id = 4;
}

message AskInoResponse {
  bool success = 1;
  string reply = 2;
  string correlation_id = 3;
  bytes rfw_description = 4;
  bytes rfw_data = 5;
  string content_type = 6;
  string source = 7;            // "Regex" | "Ml" | "Llm" | "Unrouted"
}

message BrainWatchRequest {
  // Empty request body — the stream is global to the cluster. Reserved for
  // future per-user / per-session filtering when the inspector lands.
  string user_id_filter = 1;       // empty = no filter
  string session_id_filter = 2;    // empty = no filter
}

enum BrainPulseStatusProto {
  BRAIN_PULSE_STATUS_OK = 0;
  BRAIN_PULSE_STATUS_FAILED = 1;
}

message BrainPulseProto {
  string trace_parent = 1;
  string ino_instance_id = 2;
  string user_id = 3;
  string from_grain = 4;
  string to_grain = 5;
  string method_name = 6;
  int64 duration_ms = 7;
  BrainPulseStatusProto status = 8;
  int64 timestamp_unix_ms = 9;
  // Slice C.4 — JSON-serialized first argument of the grain call (truncated to
  // 4 KB). Empty when the call had no args; truncated payloads end with "…<truncated>".
  string payload_json = 10;
}

message FireTestSynapseRequest {
  string synapse_type = 1;
  string payload_json = 2;
  string source_node_id = 3;
}

message FireTestSynapseResponse {
  bool ok = 1;
  string error = 2;
}
