name: preview

on:
  pull_request:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK || 'production' }}
      PULUMI_ESC_ENV: ${{ vars.PULUMI_ESC_ENV }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      IMAGE_TAG: pr-${{ github.event.pull_request.number || github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/TripRadar.WebUI/package-lock.json

      - uses: pulumi/actions@v5
        with:
          pulumi-version: ^3

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore and build deployment
        run: |
          dotnet build src/TripRadar.DeploymentKit/TripRadar.DeploymentKit.csproj
          dotnet build src/TripRadar.Infrastructure/TripRadar.Infrastructure.csproj
          dotnet build src/TripRadar.Server.API/TripRadar.Server.API.csproj

      - name: Build website
        working-directory: src/TripRadar.WebUI
        run: |
          npm ci
          npm run build

      - name: Publish miniapp static site
        run: dotnet publish src/TripRadar.MiniApp/TripRadar.MiniApp.csproj -c Release -o artifacts/miniapp

      - name: Pulumi preview
        working-directory: src/TripRadar.Infrastructure
        run: |
          pulumi stack select "$PULUMI_STACK"
          if [[ -n "$PULUMI_ESC_ENV" ]]; then
            pulumi env run "$PULUMI_ESC_ENV" -- pulumi preview --non-interactive
          else
            pulumi preview --non-interactive
          fi
