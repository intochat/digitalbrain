name: deploy-prod

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash

    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK || 'production' }}
      PULUMI_ESC_ENV: ${{ vars.PULUMI_ESC_ENV }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/TripRadar.WebUI/package-lock.json

      - uses: pulumi/actions@v5
        with:
          pulumi-version: ^3

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select stack and bootstrap foundation
        working-directory: src/TripRadar.Infrastructure
        env:
          IMAGE_TAG: bootstrap
        run: |
          pulumi stack select "$PULUMI_STACK"
          if [[ -n "$PULUMI_ESC_ENV" ]]; then
            pulumi env run "$PULUMI_ESC_ENV" -- pulumi up --yes --non-interactive
          else
            pulumi up --yes --non-interactive
          fi

      - name: Read stack outputs
        id: outputs
        working-directory: src/TripRadar.Infrastructure
        run: |
          pulumi stack select "$PULUMI_STACK"
          echo "acr_login_server=$(pulumi stack output acrLoginServer)" >> "$GITHUB_OUTPUT"
          ACR_LOGIN_SERVER="$(pulumi stack output acrLoginServer)"
          echo "acr_name=${ACR_LOGIN_SERVER%%.azurecr.io}" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(pulumi stack output resourceGroupName)" >> "$GITHUB_OUTPUT"
          echo "website_storage=$(pulumi stack output websiteStorageAccountName)" >> "$GITHUB_OUTPUT"
          echo "miniapp_storage=$(pulumi stack output miniAppStorageAccountName)" >> "$GITHUB_OUTPUT"
          echo "website_host=$(pulumi stack output websiteHost)" >> "$GITHUB_OUTPUT"
          echo "miniapp_host=$(pulumi stack output miniAppHost)" >> "$GITHUB_OUTPUT"
          echo "api_host=$(pulumi stack output apiHost)" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "${{ steps.outputs.outputs.acr_name }}"

      - name: Build and push API image
        run: |
          docker build -f src/TripRadar.Server.API/Dockerfile src \
            --build-arg NUGET_GITHUB_USERNAME="${{ secrets.NUGET_GITHUB_USERNAME }}" \
            --build-arg NUGET_GITHUB_TOKEN="${{ secrets.NUGET_GITHUB_TOKEN }}" \
            -t "${{ steps.outputs.outputs.acr_login_server }}/tripradar-api:$IMAGE_TAG"
          docker push "${{ steps.outputs.outputs.acr_login_server }}/tripradar-api:$IMAGE_TAG"

      - name: Build and push Jobs image
        run: |
          docker build -f src/TripRadar.Server.Jobs.API/Dockerfile src \
            --build-arg NUGET_GITHUB_USERNAME="${{ secrets.NUGET_GITHUB_USERNAME }}" \
            --build-arg NUGET_GITHUB_TOKEN="${{ secrets.NUGET_GITHUB_TOKEN }}" \
            -t "${{ steps.outputs.outputs.acr_login_server }}/tripradar-jobs:$IMAGE_TAG"
          docker push "${{ steps.outputs.outputs.acr_login_server }}/tripradar-jobs:$IMAGE_TAG"

      - name: Build website
        run: |
          BUILD_WEBSITE_SCRIPT=$(cat <<'EOF'
          cd src/TripRadar.WebUI
          npm ci
          export VITE_API_BASE_URL="https://${API_HOST}"
          export VITE_API_KEY="${API_KEY}"
          export VITE_STRIPE_PUBLISHABLE_KEY="${STRIPE_PUBLISHABLE_KEY}"
          export VITE_TELEGRAM_CLIENT_ID="${TELEGRAM_CLIENT_ID}"
          export VITE_TELEGRAM_BOT_USERNAME="${VITE_TELEGRAM_BOT_USERNAME}"
          export VITE_TELEGRAM_AUTH_BASE_URL="${VITE_TELEGRAM_AUTH_BASE_URL}"
          npm run build
          EOF
          )

          if [[ -n "$PULUMI_ESC_ENV" ]]; then
            API_HOST="${{ steps.outputs.outputs.api_host }}" pulumi env run "$PULUMI_ESC_ENV" -- bash -lc "$BUILD_WEBSITE_SCRIPT"
          else
            API_HOST="${{ steps.outputs.outputs.api_host }}" bash -lc "$BUILD_WEBSITE_SCRIPT"
          fi

      - name: Publish miniapp static site
        run: dotnet publish src/TripRadar.MiniApp/TripRadar.MiniApp.csproj -c Release -o artifacts/miniapp

      - name: Enable website static host
        run: |
          az storage blob service-properties update --account-name "${{ steps.outputs.outputs.website_storage }}" --auth-mode login --static-website --index-document index.html --404-document index.html

      - name: Enable miniapp static host
        run: |
          az storage blob service-properties update --account-name "${{ steps.outputs.outputs.miniapp_storage }}" --auth-mode login --static-website --index-document index.html --404-document index.html

      - name: Upload website static assets
        run: az storage blob upload-batch --auth-mode login --account-name "${{ steps.outputs.outputs.website_storage }}" -d '$web' -s src/TripRadar.WebUI/dist --overwrite

      - name: Upload miniapp static assets
        run: az storage blob upload-batch --auth-mode login --account-name "${{ steps.outputs.outputs.miniapp_storage }}" -d '$web' -s artifacts/miniapp/wwwroot --overwrite

      - name: Roll out final image tags
        working-directory: src/TripRadar.Infrastructure
        run: |
          pulumi stack select "$PULUMI_STACK"
          if [[ -n "$PULUMI_ESC_ENV" ]]; then
            pulumi env run "$PULUMI_ESC_ENV" -- pulumi up --yes --non-interactive
          else
            pulumi up --yes --non-interactive
          fi

      - name: Smoke checks
        run: |
          curl -fsS "https://${{ steps.outputs.outputs.website_host }}" >/dev/null
          curl -fsS "https://${{ steps.outputs.outputs.miniapp_host }}" >/dev/null
          curl -fsS "https://${{ steps.outputs.outputs.api_host }}/health" >/dev/null
