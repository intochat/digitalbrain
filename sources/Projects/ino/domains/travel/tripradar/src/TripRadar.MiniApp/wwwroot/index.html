<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TripRadar</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1c74e9",
                        "primary-dark": "#1565d8",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TripRadar.MiniApp.styles.css" rel="stylesheet" />
    <link href="styles/app.css" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
    <div id="app">
        <div class="app-loader">
            <div class="app-loader-spinner"></div>
        </div>
    </div>
    <div id="blazor-error-ui" class="hidden">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>

    <script>
        window.tg = {
            ready: function () {
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.ready();
                    Telegram.WebApp.expand();
                }
            },
            send: function (data) {
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.sendData(JSON.stringify(data));
                }
            },
            open: function (url) {
                if (!url) return;
                if (window.Telegram && Telegram.WebApp && Telegram.WebApp.openLink) {
                    Telegram.WebApp.openLink(url);
                    return;
                }
                window.open(url, "_blank", "noopener,noreferrer");
            },
            postOpen: function (url, postData) {
                if (!url || !postData) return;
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = url;
                form.target = '_blank';
                var params = new URLSearchParams(postData);
                params.forEach(function (value, key) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = value;
                    form.appendChild(input);
                });
                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);
            }
        };

        window.getTelegramInitData = () =>
            (window.Telegram?.WebApp) ? window.Telegram.WebApp.initData : '';
        window.getTelegramChatId = () => {
            try {
                var chat = window.Telegram?.WebApp?.initDataUnsafe?.chat;
                return chat ? chat.id : null;
            } catch (_) { return null; }
        };
        window.closeTelegramWebApp = () => window.Telegram?.WebApp?.close();

        window.getTelegramColorScheme = () => {
            var tg = window.Telegram?.WebApp;
            if (tg?.initData)
                return tg.colorScheme;
            return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };

        window.sessionStore = {
            get: (key) => sessionStorage.getItem(key),
            set: (key, value) => sessionStorage.setItem(key, value),
            remove: (key) => sessionStorage.removeItem(key)
        };

        window.tripRadar = window.tripRadar || {};
        tripRadar._visRef = null;
        tripRadar.registerVisibilityCallback = function(dotNetRef) {
            tripRadar._visRef = dotNetRef;
            tripRadar._onVis = function() {
                if (!document.hidden && tripRadar._visRef) {
                    tripRadar._visRef.invokeMethodAsync('OnPageVisible');
                }
            };
            document.addEventListener('visibilitychange', tripRadar._onVis);
        };
        tripRadar.unregisterVisibilityCallback = function() {
            if (tripRadar._onVis) {
                document.removeEventListener('visibilitychange', tripRadar._onVis);
                tripRadar._onVis = null;
            }
            tripRadar._visRef = null;
        };
        tripRadar.setDarkMode = function(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };
    </script>
    <script>
        (function () {
            var tg = window.Telegram?.WebApp;
            var scheme = (tg?.initData) ? tg.colorScheme
                : (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (scheme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
