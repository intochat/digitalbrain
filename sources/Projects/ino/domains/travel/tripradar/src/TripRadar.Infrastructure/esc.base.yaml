values:
  environmentVariables:
    AZURE_SUBSCRIPTION_ID: ${azure.subscriptionId}
    POSTGRES_SERVER_FQDN: ${postgres.serverFqdn}
    POSTGRES_DB_NAME: ${postgres.database}
    CORS_ORIGINS: ${api.corsOrigins}
    EMAIL_BASE_URL: ${email.baseUrl}
    REDIRECT_URL: ${email.redirectUrl}
    EMAIL_LOGO_URL: ${email.logoUrl}
    JAEGER_ENDPOINT: ${observability.jaegerEndpoint}
    GOOGLE_CLIENT_ID: ${google.clientId}
    GOOGLE_CLIENT_SECRET: ${google.clientSecret}
    STRIPE_SUCCESS_URL: ${stripe.successUrl}
    STRIPE_CANCEL_URL: ${stripe.cancelUrl}
    KAFKA_BOOTSTRAP_SERVERS: ${kafka.bootstrapServers}
    BLOB_STORAGE_URL: ${storage.publicBlobBaseUrl}
    AZURE_FRONTDOOR_ID: ${azure.frontDoorId}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${observability.otlpEndpoint}
    VITE_TELEGRAM_BOT_USERNAME: ${telegram.botUsername}
    VITE_TELEGRAM_AUTH_BASE_URL: ${telegram.authBaseUrl}
  pulumiConfig:
    tripradar:location: ${azure.location}
    tripradar:resourceGroupName: ${azure.resourceGroupName}
    tripradar:namingPrefix: ${azure.namingPrefix}
    tripradar:domains:websiteHost: ${domains.website}
    tripradar:domains:miniAppHost: ${domains.miniApp}
    tripradar:domains:apiHost: ${domains.api}
    tripradar:api:allowedCorsOrigins: ${api.corsOrigins}
    tripradar:network:vnetAddressSpace: ${network.vnetAddressSpace}
    tripradar:network:containerAppsSubnet: ${network.containerAppsSubnet}
    tripradar:network:databaseSubnet: ${network.databaseSubnet}
    tripradar:network:privateEndpointsSubnet: ${network.privateEndpointsSubnet}
