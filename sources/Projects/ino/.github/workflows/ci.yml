name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore ino.slnx

      - name: Build
        run: dotnet build ino.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ino.slnx --no-build --configuration Release --verbosity normal
