syntax = "proto3";

option csharp_namespace = "DigitalBrain.Runtime.Grpc";

package digitalbrain;

import "google/protobuf/timestamp.proto";

service BrainWatch {
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc WatchSince(WatchSinceRequest) returns (WatchSinceResponse);
  rpc GetNeuronDetail(NeuronDetailRequest) returns (NeuronDetailResponse);
  rpc GetSynapseDetail(SynapseDetailRequest) returns (SynapseDetailResponse);
  rpc GetNeuronFeature(NeuronFeatureRequest) returns (NeuronFeatureResponse);
  rpc WatchSynapses(WatchSynapsesRequest) returns (stream SynapseEdge);
}

message WatchSynapsesRequest {
  string brain_id = 1;
}

message SnapshotRequest {
  google.protobuf.Timestamp since = 1;
}

message SnapshotResponse {
  repeated NeuronNode nodes = 1;
  repeated SynapseEdge edges = 2;
  int64 cursor = 3;
}

message WatchSinceRequest {
  int64 cursor = 1;
}

message WatchSinceResponse {
  repeated NeuronNode new_nodes = 1;
  repeated SynapseEdge new_edges = 2;
  int64 cursor = 3;
}

message NeuronDetailRequest {
  string neuron_id = 1;
  google.protobuf.Timestamp since = 2;
}

message NeuronDetailResponse {
  string neuron_id = 1;
  google.protobuf.Timestamp first_seen_at = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  repeated SynapseEdge recent = 4;
}

message SynapseDetailRequest {
  string correlation_id = 1;
}

message SynapseDetailResponse {
  repeated SynapseEdge chain = 1;
}

message NeuronFeatureRequest {
  string neuron_id = 1;
}

message NeuronFeatureResponse {
  string feature_text = 1;
  string source_file = 2;
}

message NeuronNode {
  string id = 1;
  google.protobuf.Timestamp first_seen_at = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  string domain = 5;

  reserved 4;
}

message SynapseEdge {
  google.protobuf.Timestamp at = 1;
  string from_id = 2;
  string to_id = 3;
  string type_name = 4;
  string method_name = 5;
  string correlation_id = 6;
  bytes payload = 7;
}
