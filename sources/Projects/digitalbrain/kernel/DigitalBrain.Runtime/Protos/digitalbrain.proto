syntax = "proto3";

option csharp_namespace = "DigitalBrain.Runtime.Grpc";

package digitalbrain;

service DigitalBrainGateway {
  rpc Send(SynapseEnvelope) returns (SynapseEnvelope);
  rpc WatchHomeFeed(WatchHomeFeedRequest) returns (stream RfwCardEnvelope);
  rpc Transcribe(stream TranscribeRequest) returns (TranscribeResponse);
  rpc AiHealth(AiHealthRequest) returns (AiHealthResponse);
  rpc SubmitPrompt(SubmitPromptRequest) returns (SubmitPromptReply);
  rpc PushFlutterPerf(stream FlutterPerfSampleProto) returns (FlutterPerfAck);
  rpc WatchVisualLoadHint(WatchVisualLoadHintRequest) returns (stream VisualLoadHintProto);
  rpc GetLatestCard(GetLatestCardRequest) returns (GetLatestCardReply);
  rpc GetRfwLayout(RfwLayoutRequest) returns (RfwLayoutReply);
}

message SynapseEnvelope {
  string correlation_id = 1;
  string type_name = 2;
  bytes payload = 3;
}

message WatchHomeFeedRequest {}

message RfwCardEnvelope {
  string correlation_id = 1;
  string library_name = 2;
  string root_widget = 3;
  string data_json = 4;
  string timestamp = 5;
  string caller_neuron_type = 6;
}

message TranscribeRequest {
  bytes audio_chunk    = 1;
  string mime_type     = 2;  // set on the first chunk; ignored afterwards
  string language_hint = 3;  // set on the first chunk; optional
}

message TranscribeResponse {
  string transcript        = 1;
  string detected_language = 2;
  string correlation_id    = 3;
}

message AiHealthRequest {}

message AiHealthResponse {
  bool   live   = 1;
  string reason = 2;  // human-readable when !live; empty when live
  string model  = 3;  // configured reasoning-tier model id, or "" if !live
}

message SubmitPromptRequest {
  string user_id        = 1;
  string text           = 2;
  string correlation_id = 3;  // empty -> server-generated
}

message SubmitPromptReply {
  string correlation_id = 1;
}

message FlutterPerfSampleProto {
  string client_id           = 1;
  string sample_window_id    = 2;
  int32  frame_count         = 3;
  double p50_frame_ms        = 4;
  double p95_frame_ms        = 5;
  double jank_pct            = 6;
  int32  widget_count        = 7;
  int32  glow_painter_count  = 8;
  int32  rebuilds_per_second = 9;
  string platform            = 10;
  string timestamp           = 11;  // ISO-8601 UTC; gateway parses
}

message FlutterPerfAck {}

message WatchVisualLoadHintRequest {
  string client_id = 1;
}

message VisualLoadHintProto {
  string client_id = 1;
  string tier      = 2;   // "smooth" | "strained" | "red"
  string reason    = 3;
  string timestamp = 4;   // ISO-8601 UTC
}

message GetLatestCardRequest {
  string neuron_id = 1;
}

message GetLatestCardReply {
  RfwCardEnvelope card = 1;
  bool has_card = 2;
}

message RfwLayoutRequest {
  string layout_name = 1;
  string neuron_id = 2;
}

message RfwLayoutReply {
  string rfw_template = 1;
  string data_json = 2;
}

