name: Deploy Flutter Web

# Builds the DigitalBrain Flutter client and publishes it to GitHub Pages at
# https://<owner>.github.io/<repo>/. Runs on every push to master/main and
# is manually re-runnable from the Actions tab.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: UI/flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Served at the apex custom domain (digitalbrain.tech via web/CNAME), so base href is "/".
      # Flutter's default hash URL strategy means routes resolve client-side without a custom 404.html.
      - run: flutter build web --release --base-href "/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: UI/flutter/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
