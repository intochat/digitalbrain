syntax = "proto3";

package digitalbrain.surfaces;

option csharp_namespace = "DigitalBrain.Surfaces";

// Basic gRPC service for real-time UiSurface transport from kernel (neurons like KernelTaskSupervisor emit UiSurface; clients like Flutter/terminals sub for live updates instead of only timeline or dev poller).
// Server streaming for push of surfaces (matches "gRPC in ino style or streams" from 09 plan, review #3 "real transport for surfaces", E2E harness notes).
// gRPC server streaming transport for UiSurface trees to real clients (Flutter web/mobile, future terminals).
// Primary surfaces still travel the Orleans timeline (UiSurface synapse). This gRPC leg is the dedicated
// low-latency channel for the Flutter client started via IFlutter (exactly like IAspire drives kernels).
// Clients subscribe (SurfaceSubscription with optional filter) and receive UiSurfaceMessage (widget_json
// is the serialized UiWidget union from Core.UI). Taps go back via FlutterUiEvent or direct brain calls.
// Wire in Kernel (WebApp) + AppHost exposure. Clients use Grpc.Net.ClientFactory with Aspire discovery (e.g. "http://kernel").
service SurfaceStream {
  // Subscribe for surfaces (filter by id or all); server streams updates as they are emitted by neurons.
  rpc SubscribeSurfaces (SurfaceSubscription) returns (stream UiSurfaceMessage);

  // Back-channel from client (Flutter) to deliver tapped UI actions (OnTap synapses) into the brain.
  // The payload_json is the serialized OnTap Synapse from the UiWidget Button.
  // The server delivers it by emitting ClientTap, which DigitalBrainGrain (or IFlutter) handles by
  // reconstructing and SendAsync-ing the original synapse (InstallBundle, DismissAlarm, etc.).
  // This makes taps in the Flutter UI have exactly the same effect as taps in the hex1b console.
  rpc SendClientEvent (ClientEvent) returns (ClientEventResponse);

  rpc Login (LoginRequest) returns (LoginResponse);
  rpc AddBrain (AddBrainRequest) returns (BrainDescriptor);
  rpc ArchiveBrain (ArchiveBrainRequest) returns (ClientEventResponse);
}

message LoginRequest { string username = 1; }
message LoginResponse {
  string username = 1;
  repeated BrainDescriptor brains = 2;
}
message BrainDescriptor {
  string name = 1;
  string kind = 2;
  string world = 3;
  string host = 4;
  int32 gateway_port = 5;
  int64 created_at_unix_ms = 6;
  int64 last_active_unix_ms = 7;
  bool archived = 8;
  string public_key_base64 = 9;
  string fingerprint = 10;
}
message AddBrainRequest { string username = 1; string brain_name = 2; }
message ArchiveBrainRequest { string username = 1; string brain_name = 2; }

message ClientEvent {
  string surface_id = 1;
  string event_type = 2;   // "tap", "fire-synapse", etc.
  string payload_json = 3; // the OnTap Synapse JSON (or other intent data)
}

message ClientEventResponse {
  bool success = 1;
  string message = 2;
}

message SurfaceSubscription {
  string surface_id_filter = 1;
  string username = 2;
  string brain_id = 3;
}

// Minimal mirror of Core.UI.UiSurface for wire (id, emitter, simple widget payload as json for small; later full recursive proto for Button/Text/Card/Column/Row + OnTap as synapse).
message UiSurfaceMessage {
  string surface_id = 1;
  string emitter = 2;
  // Widget tree as json for initial (portable with UiWidget union in .NET clients; Dart/Flutter can parse or expand proto later).
  string widget_json = 3;
  // Timestamp for ordering/causality (aligns with SynapseMetadata).
  int64 timestamp_unix_ms = 4;
}