schemaVersion: "os-on-yaml/v0"
boot:
  name: vlad-brain
  version: 1.0.0
  desc: Vlad's DigitalBrain root world (yaml parallel)
  llms:
    - model: gemma3
      tier: fast
    - model: nemotron3-nano
      tier: reasoning
  voice: whisper-local
  durability: redis
  ui: flutter windows autostart
  discovery: on
  advertisedIpEnv: DIGITALBRAIN_ADVERTISED_IP
  seeds:
    - os-on-yaml/shell.yaml
    - os-on-yaml/marketplace.yaml
    - os-on-yaml/packager.yaml
    - os-on-yaml/creator.yaml
    - os-on-yaml/llm-agent.yaml
    - os-on-yaml/kernel-tasks.yaml
    - os-on-yaml/memory.yaml
    - os-on-yaml/weather-watcher.yaml
    - os-on-yaml/transcription.yaml
    - os-on-yaml/hex-guide.yaml
    - os-on-yaml/google-auth.yaml
    - os-on-yaml/gmail-last-senders.yaml
    - os-on-yaml/awesome-se-team.yaml
  worlds:
    - name: example-world
      from: os-on-yaml/example-world.yaml