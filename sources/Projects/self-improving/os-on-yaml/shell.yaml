schemaVersion: "os-on-yaml/v0"
neuron:
  id: shell
  grainType: shell
  version: 1.0.0
  desc: Workspace and placement (substrate, system)
  handles:
    - synapse: PinSurface
    - synapse: UnpinSurface
    - synapse: MoveSurface
    - synapse: BundleInstalled
    - synapse: BundleUninstalled
    - synapse: UiSurface
    - synapse: NeuronTelemetry
  emits:
    - WorkspaceChanged
  isSystem: true
  observedSynapses: 0
  rules:
    - on: UiSurface
      do:
        - show:
            card:
              title: "Liquid Glass Desktop"
              content:
                - kind: container
                  text: "12|glass"
                  content:
                    - kind: row
                      content:
                        - kind: icon
                          text: "widgets"
                        - kind: text
                          text: "DigitalBrain OS"
                        - kind: divider
                        - kind: button
                          label: "🔍 Search"
                          action:
                            type: ListPublished
                        - kind: button
                          label: "⎋ Sign out"
                          action:
                            type: BeginGoogleAuth
                - kind: row
                  content:
                    - kind: container
                      text: "8|glass"
                      content:
                        - kind: column
                          content:
                            - kind: text
                              text: "— VIEWS —"
                            - kind: button
                              label: "🏠 Home"
                              action:
                                type: PinSurface
                                args:
                                  SurfaceId: "marketplace"
                                  Region: "main"
                                  Order: "0"
                            - kind: button
                              label: "✅ Tasks"
                              action:
                                type: PinSurface
                                args:
                                  SurfaceId: "kerneltasks"
                                  Region: "main"
                                  Order: "1"
                            - kind: button
                              label: "🛒 Marketplace"
                              action:
                                type: PinSurface
                                args:
                                  SurfaceId: "marketplace"
                                  Region: "main"
                                  Order: "2"
                            - kind: button
                              label: "✨ Creator"
                              action:
                                type: PinSurface
                                args:
                                  SurfaceId: "ui-def-creator"
                                  Region: "main"
                                  Order: "3"
                            - kind: button
                              label: "📧 Mail"
                              action:
                                type: OpenWindow
                                args:
                                  SurfaceId: "gmail-senders-chart"
                                  Title: "📧 Mail"
                                  X: "80"
                                  Y: "80"
                                  Width: "540"
                                  Height: "380"
                            - kind: button
                              label: "🌤️ Weather"
                              action:
                                type: PinSurface
                                args:
                                  SurfaceId: "weather"
                                  Region: "widgets"
                                  Order: "5"
                            - kind: button
                              label: "🔐 Auth"
                              action:
                                type: PinSurface
                                args:
                                  SurfaceId: "ui-def-google-auth"
                                  Region: "main"
                                  Order: "6"
                            - kind: button
                              label: "🎨 Design System"
                              action:
                                type: PinSurface
                                args:
                                  SurfaceId: "ui-kit"
                                  Region: "main"
                                  Order: "7"
    - on: NeuronTelemetry
      when:
        Event: "UninstallRefused"
      do:
        - show:
            card:
              title: "System bundle"
              content:
                - kind: column
                  content:
                    - kind: text
                      text: "Cannot uninstall (system: true, see telemetry data)"
    - on: NeuronTelemetry
      when:
        Event: "QuarantineGreen"
      do:
        - show:
            card:
              title: "Quarantine Green"
              content:
                - kind: text
                  text: "sig+tests passed, promoted"
                - kind: button
                  label: "Use"
                  action:
                    type: InstallFromMarketplace
                    args:
                      ExperienceId: "demo"