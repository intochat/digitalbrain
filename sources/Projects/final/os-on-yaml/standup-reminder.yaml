schemaVersion: "os-on-yaml/v0"
neuron:
  id: standup-reminder
  grainType: standup-reminder
  version: 0.1.0
  desc: Daily standup nudge with a tappable checklist
  emits:
    - SetAlarm
    - UiSurface
  rules:
    - on: SetAlarm
      as: a
      do:
        - show:
            card:
              title: "Standup — {a.Label}"
              content:
                - kind: text
                  text: "Yesterday / Today / Blockers:"
                - kind: button
                  label: "✓ Yesterday"
                  action:
                    type: InspectKernelTask
                    args:
                      taskId: "standup-yesterday"
                - kind: button
                  label: "✓ Today"
                  action:
                    type: InspectKernelTask
                    args:
                      taskId: "standup-today"
                - kind: button
                  label: "✓ Blockers"
                  action:
                    type: InspectKernelTask
                    args:
                      taskId: "standup-blockers"
                - kind: button
                  label: "Snooze 10m"
                  action:
                    type: SetAlarm
                    args:
                      minutes: "10"
                      label: "standup"
  observedSynapses: 0