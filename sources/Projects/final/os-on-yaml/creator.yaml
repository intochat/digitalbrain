schemaVersion: "os-on-yaml/v0"
neuron:
  id: creator
  grainType: creator
  version: 1.0.0
  desc: Creator
  handles:
    - synapse: ImprovementProposal
      fields:
        - name: Description
          type: string
        - name: SuggestedAction
          type: string
  emits:
    - UiSurface
  region: main
  observedSynapses: 0
  rules:
    - on: ImprovementProposal
      as: proposal
      do:
        - show:
            card:
              title: "Proposal: $description"
              content:
                - kind: text
                  text: "$description"
                - kind: button
                  label: "Approve"
                  action:
                    type: ApproveAction
                    args:
                      action: "execute"
                - kind: button
                  label: "Dismiss"
                  action:
                    type: NeuronTelemetry
                    args:
                      event: "ProposalDismissed"
scenarios:
  - name: "proposal surfaces with approve/dismiss"
    when:
      emit: ImprovementProposal
    then:
      - broadcast: UiSurface
