schemaVersion: "os-on-yaml/v0"
neuron:
  id: telegram-bot
  grainType: telegram-bot
  version: 0.1.0
  desc: Telegram bot integration (structured declarative). Demo launches Mail floating experience as TG WebApp. Behavior in TelegramConnectorNeuron.
  requires: []
  emits:
    - UiSurface
    - BeginTelegramConnect
  triggers:
    - BeginTelegramConnect
    - TelegramBotLaunch
  rules:
    - on: BeginTelegramConnect
      do:
        - show:
            card:
              title: "Telegram Bot (demo)"
              content:
                - kind: text
                  text: "Connect TG bot (grant for token). Demo only — reuses existing draggable floating Mail."
                - kind: button
                  label: "Launch Mail in TG WebApp"
                  action:
                    type: BeginTelegramConnect
                    args: {}
    - on: BeginTelegramConnect
      as: _
      do:
        - show:
            card:
              title: "TG WebApp Ready"
              content:
                - kind: text
                  text: "Future: real sends via api.telegram.org + vault + grants."
                - kind: text
                  text: "Opens current client (Mail floatings + streaming) as Telegram WebApp."
                - kind: hyperlink
                  text: "Open Mail as TG WebApp (floating)"
                  # Demo url: kernel flutter web + tg mode + exp to show the wired Mail floating window.
                  url: "http://localhost:8080/flutter?tg=1&exp=gmail-senders-chart&mode=floating"
