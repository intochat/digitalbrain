schemaVersion: "os-on-yaml/v0"
boot:
  name: example-world
  version: 1.0.0
  desc: Second world declared via world: from in brain.ino
  seeds:
    - os-on-yaml/marketplace.yaml
    - os-on-yaml/packager.yaml
    - os-on-yaml/creator.yaml
  observedSynapses: 0
  system: true
  rules:
    - on: WorldConnected
      do:
        - show:
            card:
              title: "World $name"
              content:
                - kind: text
                  text: "Connected world frame (UI via shell + surfaces)"
                - kind: text
                  text: "Marketplace connected by default (search/install via public contract)"
                - kind: button
                  label: "Search marketplace"
                  action:
                    type: ListPublished
                - kind: button
                  label: "Install demo from marketplace"
                  action:
                    type: InstallFromMarketplace
                    args:
                      ExperienceId: "demo"
