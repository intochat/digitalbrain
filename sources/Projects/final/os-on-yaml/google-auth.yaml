schemaVersion: "os-on-yaml/v0"
neuron:
  id: google-auth
  grainType: google-auth
  version: 0.1.0
  desc: Google auth and grants
  emits:
    - AuthLinkReady
    - GoogleAuthCompleted
    - UiSurface
  observedSynapses: 0
  rules:
    - on: BeginGoogleAuth
      do:
        - show:
            card:
              title: "Connect Google"
              content:
                - kind: text
                  text: "Authenticate with Google"
                - kind: button
                  label: "Connect"
                  action:
                    type: BeginGoogleAuth
                    args:
                      provider: "google"
