schemaVersion: "os-on-yaml/v0"
neuron:
  id: hex-guide
  grainType: hex-guide
  version: 1.0.0
  desc: Hex guide
  emits:
    - UiSurface
  observedSynapses: 0
  rules:
    - on: ClientTap
      do:
        - show:
            card:
              title: "Hex Guide"
              content:
                - kind: text
                  text: "Interactive hex reference"
                - kind: button
                  label: "Open"
                  action:
                    type: ClientTap
                    args:
                      surface: "hex"
