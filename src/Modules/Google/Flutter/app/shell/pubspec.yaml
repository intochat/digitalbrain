name: digitalbrain_flutter_shell
description: >
  Material chrome for DigitalBrain OS surface (Windows + web). Depends on
  pure-Dart clients/flutter/core (package digitalbrain_flutter) for edge/
  projection only. Pixels only — never Orleans/MCP.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  digitalbrain_flutter:
    path: ../core
  digitalbrain_ui:
    path: ../ui
  uuid: ^4.6.0
  provider: ^6.1.5+1
  web: ^1.1.1
  url_launcher: ^6.3.2
  file_picker: ^8.3.7
  markdraw: ^0.2.0
  archive: ^4.0.7
  xml: ^6.6.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
