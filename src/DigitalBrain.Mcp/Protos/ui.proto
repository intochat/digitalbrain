syntax = "proto3";

option csharp_namespace = "DigitalBrain.V2.Ui.Grpc";

package digitalbrain.v2.ui;

service DigitalBrainV2Ui {
  rpc BootstrapSession(BootstrapSessionRequest) returns (SessionReply);
  rpc RefreshSession(RefreshSessionRequest) returns (SessionReply);
  rpc WatchSurfaceFeed(WatchSurfaceFeedRequest) returns (stream SurfaceFeedEvent);
  rpc AcknowledgeSurfaceFeed(AcknowledgeSurfaceFeedRequest) returns (AcknowledgeSurfaceFeedReply);
  rpc SubmitAction(SubmitActionRequest) returns (SubmitActionReply);
  rpc LogoutSession(LogoutSessionRequest) returns (LogoutSessionReply);
  rpc GetFeatureDraft(GetFeatureDraftRequest) returns (FeatureDraftReply);
  rpc ResetFeatureDraftInstallation(ResetFeatureDraftInstallationRequest) returns (FeatureDraftReply);
  rpc ReviseFeatureDraft(ReviseFeatureDraftRequest) returns (FeatureDraftReply);
  rpc SuggestFeatureChange(SuggestFeatureChangeRequest) returns (FeatureDraftPatchReply);
  rpc VerifyFeatureDraft(VerifyFeatureDraftRequest) returns (FeatureReleaseReviewReply);
  rpc ReviewFeatureAccess(ReviewFeatureAccessRequest) returns (FeatureAccessReviewReply);
  rpc InstallFeatureVersion(InstallFeatureVersionRequest) returns (FeatureInstallReply);
  rpc ResumeOriginatingRequest(ResumeOriginatingRequestRequest) returns (ResumeOriginatingRequestReply);
  rpc ListFeatures(ListFeaturesRequest) returns (ListFeaturesReply);
  rpc GetFeature(GetFeatureRequest) returns (FeatureReply);
  rpc GetFeatureReleaseSource(GetFeatureReleaseSourceRequest) returns (FeatureReleaseSourceReply);
  rpc RollbackFeatureVersion(RollbackFeatureVersionRequest) returns (FeatureReply);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsReply);
  rpc GetConnection(GetConnectionRequest) returns (ConnectionReply);
  rpc ListActivity(ListActivityRequest) returns (ListActivityReply);
  rpc GetRun(GetRunRequest) returns (RunReply);
  rpc ListMemoryItems(ListMemoryItemsRequest) returns (ListMemoryItemsReply);
  rpc GetMemoryItem(GetMemoryItemRequest) returns (MemoryItemReply);
  rpc GetHomeSummary(GetHomeSummaryRequest) returns (HomeSummaryReply);
}

message BootstrapSessionRequest {
  reserved 1;
  string username = 2;
  string password = 3;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message SessionReply {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at_unix_ms = 3;
  int64 refresh_expires_at_unix_ms = 4;
  string session_id = 5;
  string owner_id = 6;
  string actor_id = 7;
  reserved 8;
}

enum FeedAudienceKind {
  FEED_AUDIENCE_KIND_ACTOR = 0;
  FEED_AUDIENCE_KIND_OWNER = 1;
  FEED_AUDIENCE_KIND_PUBLIC = 2;
}

message WatchSurfaceFeedRequest {
  int64 after_sequence = 1;
  FeedAudienceKind audience = 2;
  repeated string client_capabilities = 3;
  int32 max_batch_size = 4;
}

message SurfaceFeedEvent {
  oneof event {
    string surface_json = 1;
    SurfaceFeedReset reset = 2;
  }
}

message SurfaceFeedReset {
  string reason = 1;
  int64 resume_sequence = 2;
  repeated string snapshot_json = 3;
}

message AcknowledgeSurfaceFeedRequest {
  FeedAudienceKind audience = 1;
  int64 sequence = 2;
}

message AcknowledgeSurfaceFeedReply {
  int64 acknowledged_sequence = 1;
}

message SubmitActionRequest {
  string binding_id = 1;
  string action_token = 2;
  string surface_id = 3;
  int32 surface_revision = 4;
  string input_json = 5;
}

message SubmitActionReply {
  string operation_id = 1;
  string idempotency_key = 2;
}

message LogoutSessionRequest {
  string refresh_token = 1;
}

message LogoutSessionReply {}

enum FeatureDraftStatus {
  FEATURE_DRAFT_STATUS_UNSPECIFIED = 0;
  FEATURE_DRAFT_STATUS_DRAFT = 1;
  FEATURE_DRAFT_STATUS_INSTALLED = 2;
}

enum FeatureSourceKind {
  FEATURE_SOURCE_KIND_UNSPECIFIED = 0;
  FEATURE_SOURCE_KIND_REPOSITORY = 1;
  FEATURE_SOURCE_KIND_RUNTIME_AUTHORED = 2;
}

enum FeatureScenarioOutcome {
  FEATURE_SCENARIO_OUTCOME_UNSPECIFIED = 0;
  FEATURE_SCENARIO_OUTCOME_PASSED = 1;
  FEATURE_SCENARIO_OUTCOME_FAILED = 2;
  FEATURE_SCENARIO_OUTCOME_SKIPPED = 3;
}

message GetFeatureDraftRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
}

message ResetFeatureDraftInstallationRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
  string idempotency_id = 4;
}

message ReviseFeatureDraftRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
  optional int64 expected_revision = 4;
  string idempotency_id = 5;
  oneof command {
    ReviseFeatureBehaviorInput revise_behavior = 6;
    ReviseFeatureSourceInput revise_source = 7;
    AcceptSuggestedChangeInput accept_suggested_change = 8;
    RejectSuggestedChangeInput reject_suggested_change = 9;
  }
}

message SuggestFeatureChangeRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
  optional int64 expected_revision = 4;
  string guidance = 5;
  string suggestion_id = 6;
}

message VerifyFeatureDraftRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
  optional int64 expected_revision = 4;
  string idempotency_id = 5;
}

message ReviewFeatureAccessRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
  optional int64 expected_revision = 4;
  string installation_id = 5;
  string release_digest = 6;
  repeated FeatureGrant grants = 7;
  repeated string subscriptions = 8;
}

message InstallFeatureVersionRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
  optional int64 expected_revision = 4;
  string installation_id = 5;
  string release_digest = 6;
  repeated FeatureGrant grants = 7;
  repeated string subscriptions = 8;
  string decision_id = 9;
  string idempotency_id = 10;
}

message ReviseFeatureBehaviorInput {
  reserved "owner_id", "actor_id";
  FeatureBehavior behavior = 1;
}

message ReviseFeatureSourceInput {
  reserved "owner_id", "actor_id";
  FeatureSourceSnapshot source = 1;
}

message AcceptSuggestedChangeInput {
  reserved "owner_id", "actor_id";
  FeatureDraftPatch patch = 1;
}

message RejectSuggestedChangeInput {
  reserved "owner_id", "actor_id";
  string patch_id = 1;
  optional int64 base_revision = 2;
}

message OriginatingRequest {
  reserved "owner_id", "actor_id";
  string operation_id = 1;
  optional string conversation_id = 2;
  string text = 3;
}

message FeatureScenario {
  reserved "owner_id", "actor_id";
  string scenario_id = 1;
  string name = 2;
  string given = 3;
  string when = 4;
  string then = 5;
}

message FeatureBehavior {
  reserved "owner_id", "actor_id";
  repeated FeatureScenario scenarios = 1;
}

message FeatureSourceFile {
  reserved "owner_id", "actor_id";
  string path = 1;
  string content = 2;
}

message FeatureSourceSnapshot {
  reserved "owner_id", "actor_id";
  string implementation_project_path = 1;
  string scenario_project_path = 2;
  repeated FeatureSourceFile files = 3;
}

message FeatureVerification {
  reserved "owner_id", "actor_id";
  string release_digest = 1;
  int32 total = 2;
  int32 passed = 3;
  int32 failed = 4;
  int32 skipped = 5;
  int64 verified_at_unix_ms = 6;
  repeated FeatureVerificationScenario scenarios = 7;
  repeated FeatureVerificationArtifact artifacts = 8;
  string source_reference = 9;
}

message FeatureVerificationScenario {
  reserved "owner_id", "actor_id";
  string scenario_id = 1;
  string name = 2;
  FeatureScenarioOutcome outcome = 3;
  optional string safe_failure = 4;
  int64 duration_milliseconds = 5;
}

message FeatureVerificationArtifact {
  reserved "owner_id", "actor_id";
  string name = 1;
  string media_type = 2;
  int64 size_bytes = 3;
  string digest = 4;
}

message FeatureDraft {
  reserved "owner_id", "actor_id";
  string draft_id = 1;
  OriginatingRequest originating_request = 2;
  string goal = 3;
  FeatureDraftStatus status = 4;
  FeatureBehavior behavior = 5;
  FeatureSourceSnapshot source = 6;
  optional FeatureVerification verification = 7;
  optional string installation_id = 8;
  int64 revision = 9;
  int64 created_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
}

message FeatureDraftPatch {
  reserved "owner_id", "actor_id";
  string patch_id = 1;
  string draft_id = 2;
  optional int64 base_revision = 3;
  string summary = 4;
  FeatureBehavior replacement_behavior = 5;
  FeatureSourceSnapshot replacement_source = 6;
}

message FeatureRelease {
  reserved "owner_id", "actor_id";
  string digest = 1;
  FeatureSourceKind source_kind = 2;
  repeated string requested_capability_ids = 3;
  repeated string dependencies = 4;
  string source_reference = 5;
  FeatureSourceSnapshot source = 6;
}

message FeatureGrant {
  reserved "owner_id", "actor_id";
  string capability_id = 1;
  int32 capability_version = 2;
  optional string connection_id = 3;
  string constraints_json = 4;
  optional string provider = 5;
}

message FeatureInstallationRecovery {
  reserved "owner_id", "actor_id";
  bool installed = 1;
  FeatureVerification verification = 2;
  FeatureRelease release = 3;
  string installation_id = 4;
  repeated FeatureGrant grants = 5;
  repeated string subscriptions = 6;
  optional FeatureRelease previous_release = 7;
  optional string decision_id = 8;
  optional string idempotency_id = 9;
  bool rollback_available = 10;
  bool paused = 11;
  optional string pause_reason = 12;
}

message FeatureDraftReply {
  reserved "owner_id", "actor_id";
  FeatureDraft draft = 1;
  FeatureInstallationRecovery recovery = 2;
}

message FeatureDraftPatchReply {
  reserved "owner_id", "actor_id";
  FeatureDraftPatch patch = 1;
}

message FeatureReleaseReviewReply {
  reserved "owner_id", "actor_id";
  FeatureDraft draft = 1;
  optional FeatureRelease release = 2;
  FeatureVerification verification = 3;
}

message FeatureAccessReviewReply {
  reserved "owner_id", "actor_id";
  FeatureDraft draft = 1;
  FeatureRelease release = 2;
  string installation_id = 3;
  repeated FeatureGrant grants = 4;
  repeated string subscriptions = 5;
  optional FeatureRelease previous_release = 6;
}

message FeatureInstallReply {
  reserved "owner_id", "actor_id";
  FeatureDraft draft = 1;
  FeatureRelease release = 2;
  string installation_id = 3;
  repeated FeatureGrant active_grants = 4;
  repeated string subscriptions = 5;
  bool rollback_available = 6;
  bool paused = 7;
  optional string pause_reason = 8;
}

message ResumeOriginatingRequestRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string draft_id = 3;
  optional int64 expected_revision = 4;
  string idempotency_id = 5;
}

message ResumeOriginatingRequestReply {
  reserved "owner_id", "actor_id", "prompt", "conversation_id";
  string command_id = 1;
  string operation_id = 2;
  string phase = 3;
  int64 version = 4;
}

message ListFeaturesRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
}

message ListFeaturesReply {
  reserved "owner_id", "actor_id";
}

message GetFeatureRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string feature_id = 3;
}

message GetFeatureReleaseSourceRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string feature_id = 3;
  string installation_id = 4;
  string release_digest = 5;
  string source_reference = 6;
}

message FeatureReleaseSourceReply {
  reserved "owner_id", "actor_id";
  string feature_id = 1;
  string installation_id = 2;
  string release_digest = 3;
  string source_reference = 4;
  FeatureSourceSnapshot source = 5;
}

message RollbackFeatureVersionRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string feature_id = 3;
  string expected_active_digest = 4;
  string target_digest = 5;
  string idempotency_id = 6;
  optional int64 expected_revision = 7;
}

message FeatureReply {
  reserved "owner_id", "actor_id";
  string feature_id = 1;
  OriginatingRequest originating_request = 2;
  FeatureRelease active_release = 3;
  optional FeatureRelease previous_release = 4;
  repeated FeatureGrant active_grants = 5;
  repeated string subscriptions = 6;
  bool rollback_available = 7;
  bool paused = 8;
  optional string pause_reason = 9;
  string installation_id = 10;
  int64 revision = 11;
}

message ListConnectionsRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
}

message ListConnectionsReply {
  reserved "owner_id", "actor_id";
}

message GetConnectionRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string connection_id = 3;
}

message ConnectionReply {
  reserved "owner_id", "actor_id";
}

message ListActivityRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
}

message ListActivityReply {
  reserved "owner_id", "actor_id";
}

message GetRunRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string run_id = 3;
}

message RunReply {
  reserved "owner_id", "actor_id";
}

message ListMemoryItemsRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
}

message ListMemoryItemsReply {
  reserved "owner_id", "actor_id";
}

message GetMemoryItemRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
  string memory_item_id = 3;
}

message MemoryItemReply {
  reserved "owner_id", "actor_id";
}

message GetHomeSummaryRequest {
  reserved 1, 2;
  reserved "owner_id", "actor_id";
}

message HomeSummaryReply {
  reserved "owner_id", "actor_id";
}
