name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: build
        run: dotnet build DigitalBrain.slnx -c Release -warnaserror --nologo
        timeout-minutes: 12

  corev2-tests:
    needs: source-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: architecture
            project: tests/CoreV2/Brain.Architecture.Tests/Brain.Architecture.Tests.csproj
            arguments: >-
              --report-xunit-trx
              --report-xunit-trx-filename architecture.trx
              --results-directory TestResults/architecture
          - name: abstractions
            project: tests/CoreV2/Brain.Abstractions.Tests/Brain.Abstractions.Tests.csproj
            arguments: ''
          - name: core
            project: tests/CoreV2/Brain.Core.Tests/Brain.Core.Tests.csproj
            arguments: ''
          - name: proof
            project: tests/CoreV2/Brain.Proof.Tests/Brain.Proof.Tests.csproj
            arguments: ''
    name: corev2-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: test ${{ matrix.name }}
        run: dotnet test ${{ matrix.project }} -c Release ${{ matrix.arguments }}
        timeout-minutes: 12
      - name: publish architecture test results
        if: always() && matrix.name == 'architecture'
        uses: actions/upload-artifact@v7
        with:
          name: corev2-architecture-test-results
          path: TestResults/architecture/architecture.trx
          if-no-files-found: error
