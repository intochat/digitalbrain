name: ci

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      # Brain.slnx is the canonical solution. SkipFlutterBuild keeps the sibling Flutter client
      # reference visible locally without requiring ../app to be checked out on GitHub runners.
      # E2E specs need the full Aspire stack (Ollama + replicas) + Playwright and are gated out of headless CI,
      # mirroring the documented "DigitalBrain.Tests excluding gated E2E" verification.
      - run: dotnet test Brain.slnx -c Release -p:SkipFlutterBuild=true --filter "FullyQualifiedName!~E2E"
