name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  dotnet-build-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - run: dotnet restore DigitalBrain.slnx

      - run: dotnet format whitespace DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

      # Solution builds cannot take -r. Directory.Build.props clears host RID under CI=true
      # so Web SDK / Foundry do not demand net11.0/linux-x64 after a portable restore.
      - run: dotnet build DigitalBrain.slnx -c Release --no-restore -warnaserror --nologo

      # Simulation is the durable in-process gate. Aspire/E2E need a live AppHost and stay out of the default PR gate.
      - name: Simulation tests
        run: |
          set -eu
          out=tests/DigitalBrain.Simulation.Tests/bin/Release/net11.0
          chmod +x "$out/DigitalBrain.Simulation.Tests"
          # xunit.v3 MTP apphost runs cleanly; `dotnet test` MTP handshake fails on this SDK
          # (exit 5 / zero tests) even though --list-tests via the apphost succeeds.
          "$out/DigitalBrain.Simulation.Tests"

  flutter-web-build:
    name: Flutter web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/Modules/UI/Flutter/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/UI/Flutter
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/Modules/UI/Flutter
        run: dart format --output=none --set-exit-if-changed core kit shell

      - name: Core package tests
        working-directory: src/Modules/UI/Flutter/core
        run: dart test

      - name: Kit package tests
        working-directory: src/Modules/UI/Flutter/kit
        run: flutter test --no-pub

      - name: Shell tests
        run: flutter test --no-pub

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub
