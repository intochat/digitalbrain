name: ci

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Brain.slnx is the canonical solution. SkipFlutterBuild keeps the in-repo Flutter client
      # reference visible in headless .NET jobs without running Flutter.
      # E2E specs are gated out of headless CI, mirroring the documented
      # "DigitalBrain.Tests excluding gated E2E" verification.
      - run: dotnet test Brain.slnx -c Release -p:SkipFlutterBuild=true -p:SkipDeployBuild=true --filter "FullyQualifiedName!~E2E"
