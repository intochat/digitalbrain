name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  dotnet-build-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Flutter for module and product browser tests
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/Google/Flutter/app
        run: flutter pub get --enforce-lockfile

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Docs and packaging path lint
        run: |
          files=".github/workflows/deploy.yml \
            src/Applications/IntoChat/IntoChat/Dockerfile \
            src/Applications/IntoChat/IntoChat/docker-entrypoint.sh \
            src/Applications/IntoChat/IntoChat/Properties/PublishProfiles/Container.pubxml \
            README.md CONTEXT.md continuation.md"
          if grep -Hn -E 'src/Modules/DigitalBrain/Mcp|DigitalBrain\.Mcp|DigitalBrain\.Excel' $files; then
            echo "::error::Stale moved/deleted path in CI, publish, container or status docs." >&2
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore DigitalBrain.slnx

      - name: Format code
        run: dotnet format whitespace DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build DigitalBrain.slnx -c Release --no-restore -p:CodeGraphRefresh=false

      - name: Build the behavior file app
        run: dotnet build src/Behaviors/timer-report.cs -c Release -p:CodeGraphRefresh=false

      - name: Validate NuGet packages
        run: dotnet pack DigitalBrain.slnx -c Release --no-build -o artifacts

      - name: Install browser and system dependencies
        run: pwsh src/Modules/Google/Flutter/Tests/E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: dotnet test --solution DigitalBrain.slnx -c Release --no-build --max-parallel-test-modules 1 --ignore-exit-code 8
        env:
          DIGITALBRAIN_E2E_LIVE_MODEL: '0'
          DIGITALBRAIN_E2E_HEADED: '0'

  flutter-web-build:
    name: Flutter analyze and web build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/Modules/Google/Flutter/app/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/Google/Flutter/app
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/Modules/Google/Flutter/app
        run: dart format --output=none --set-exit-if-changed core ui shell

      - name: Analyze core, ui and shell
        working-directory: src/Modules/Google/Flutter/app
        run: |
          (cd core && dart analyze --fatal-infos)
          (cd ui && flutter analyze --no-pub)
          (cd shell && flutter analyze --no-pub)

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub

      - name: Flutter widget and client tests
        working-directory: src/Modules/Google/Flutter/app
        run: |
          (cd ui && flutter test --no-pub)
          (cd shell && flutter test --no-pub)
