name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CI: 'true'
  GITLEAKS_VERSION: '8.30.1'

# Gate jobs: format, build, facts, runtime, product, no-orleans, template. The aggregate `ci` job needs all of them.
jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DigitalBrain.slnx -v quiet

      - name: Format
        run: dotnet format DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan history with gitleaks
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --verbose --config .gitleaks.toml --baseline-path .gitleaks-baseline.json'

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DigitalBrain.slnx -c Release

      - name: Pack
        run: |
          dotnet pack DigitalBrain.slnx -c Release --no-build -o artifacts/packages
          dotnet pack templates/DigitalBrain.Templates/DigitalBrain.Templates.csproj -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          retention-days: 7

  # Facts: unit, architecture, analyzer, testing, capabilities, packaging, graph, and Calculator unit facts.
  facts:
    name: facts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DigitalBrain.slnx -v quiet

      - name: Facts
        run: |
          for project in \
            tests/DigitalBrain.Tests.Unit \
            tests/DigitalBrain.Architecture.Tests.Unit \
            tests/DigitalBrain.Analyzers.Tests.Unit \
            tests/DigitalBrain.Testing.Tests.Unit \
            tests/DigitalBrain.Runtime.Orleans.Tests.Unit \
            tests/DigitalBrain.Runtime.Http.Tests.Unit \
            tests/DigitalBrain.Graph.Tests.Unit \
            tests/DigitalBrain.Capabilities.Storage.Tests.Unit \
            tests/DigitalBrain.Capabilities.Secrets.Tests.Unit \
            tests/DigitalBrain.Capabilities.Identity.Tests.Unit \
            tests/DigitalBrain.Capabilities.Compute.Tests.Unit \
            tests/DigitalBrain.Capabilities.Connections.Tests.Unit \
            tests/DigitalBrain.Capabilities.Http.Tests.Unit \
            tests/DigitalBrain.Capabilities.Tools.Tests.Unit \
            tests/DigitalBrain.Identity.Local.Tests.Unit \
            tests/DigitalBrain.Runtime.Synapses.Tests.Unit \
            examples/Calculator.Tests.Unit; do
            name=$(basename "$project")
            dotnet test --project "$project/$name.csproj" -c Release
          done

  # Runtime: in-process silo and Azurite integration facts.
  runtime:
    name: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - name: Runtime integration facts
        run: |
          for project in \
            tests/DigitalBrain.Runtime.Orleans.Tests.Integration \
            tests/DigitalBrain.Runtime.Orleans.Azure.Tests.Integration \
            tests/DigitalBrain.Runtime.Http.Tests.Integration \
            examples/Calculator.Tests.Integration; do
            name=$(basename "$project")
            dotnet test --project "$project/$name.csproj" -c Release
          done

  # Product: framework host conformance (R4-03, 04-15) on TestOS, local Orleans and Azurite.
  product:
    name: product
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start Azurite
        run: docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - name: Framework host conformance facts
        run: dotnet test --project tests/DigitalBrain.Framework.Tests.E2E/DigitalBrain.Framework.Tests.E2E.csproj -c Release

  # The Orleans-free packages must stay Orleans-free, transitively.
  no-orleans:
    name: no-orleans
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: No Orleans in the core packages
        run: |
          status=0
          for name in DigitalBrain DigitalBrain.Simulation DigitalBrain.UI DigitalBrain.Testing DigitalBrain.Analyzers DigitalBrain.Capabilities.Compute DigitalBrain.Capabilities.Connections DigitalBrain.Capabilities.Http DigitalBrain.Capabilities.Tools DigitalBrain.Identity.Local; do
            project="src/$name/$name.csproj"
            dotnet restore "$project" -v quiet
            if dotnet list "$project" package --include-transitive | grep -i orleans; then
              echo "::error::$name references Orleans"
              status=1
            fi
          done
          exit $status

  # dotnet new intochat-app / intochat-module tests outside the repository, from this run's packages.
  template:
    name: template
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Template smoke facts (unit)
        run: dotnet test --project tests/DigitalBrain.Templates.Tests.Unit/DigitalBrain.Templates.Tests.Unit.csproj -c Release

      # 08-05: dotnet new intochat-app (Notes, Foo.Bar) into a custom hive, build -warnaserror, generated baseline green, DB0030 probe.
      - name: intochat-app and intochat-module template facts
        env:
          DIGITALBRAIN_TEMPLATE_PACKAGES: ${{ github.workspace }}/artifacts/packages
        run: dotnet test --project tests/DigitalBrain.Templates.Tests.Integration/DigitalBrain.Templates.Tests.Integration.csproj -c Release

  ci:
    name: ci
    needs: [format, build, facts, runtime, product, no-orleans, template]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
