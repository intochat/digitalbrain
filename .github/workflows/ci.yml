name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-build-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - run: dotnet restore Brain.slnx

      - run: dotnet format whitespace Brain.slnx --verify-no-changes --no-restore --verbosity minimal

      - run: dotnet build Brain.slnx --no-restore

      - run: dotnet test Brain.slnx --no-restore

  flutter-web-build:
    name: Flutter web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-wasm-dry-run
        working-directory: app
