name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  dotnet-build-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DigitalBrain.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build DigitalBrain.slnx -c Release --no-restore -v quiet -p:CodeGraphRefresh=false

      - name: Build the sample C# file app
        run: dotnet build src/Modules/Microsoft/CSharp/Samples/timer-report.cs -c Release -v quiet -p:CodeGraphRefresh=false

      - name: Validate NuGet packages
        run: dotnet pack DigitalBrain.slnx -c Release --no-build -v quiet -o artifacts

      # One deterministic image build before the parallel AppHost sessions race to
      # request it; every E2E web host then serves this cached image in seconds.
      - name: Build the shell web image
        run: docker build -f src/Modules/Google/Flutter/app/shell/Dockerfile src/Modules/Google/Flutter/app

      - name: Test
        run: dotnet test DigitalBrain.slnx -c Release --no-build -v quiet
        env:
          # No Flutter SDK on this runner: E2E web hosts serve the containerized bundle.
          DigitalBrain__Flutter__Hosting__WebContainer: 'true'

  flutter-web-build:
    name: Flutter analyze and web build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/Modules/Google/Flutter/app/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/Google/Flutter/app
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/Modules/Google/Flutter/app
        run: dart format --output=none --set-exit-if-changed core ui shell

      - name: Analyze Flutter packages
        working-directory: src/Modules/Google/Flutter/app
        run: |
          (cd core && dart analyze --fatal-infos)
          (cd ui && flutter analyze --no-pub)
          (cd shell && flutter analyze --no-pub)

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub

      - name: Flutter widget and client tests
        working-directory: src/Modules/Google/Flutter/app
        run: |
          (cd ui && flutter test --no-pub)
          (cd shell && flutter test --no-pub)
