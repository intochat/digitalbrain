name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'refactor/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  dotnet-build-test:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DigitalBrain.slnx -v quiet

      - name: Format code
        run: dotnet format whitespace DigitalBrain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build DigitalBrain.slnx -c Release --no-restore -v quiet -p:CodeGraphRefresh=false

      - name: Build the sample C# file app
        run: dotnet build src/Modules/Microsoft/CSharp/Samples/timer-report.cs -c Release -v quiet -p:CodeGraphRefresh=false

      - name: Validate NuGet packages
        run: dotnet pack DigitalBrain.slnx -c Release --no-build -v quiet -o artifacts

      # The one shared E2E host (IntoChatHostFixture) serves the web shell, so the suite
      # compiles Flutter once per run and drives it with Playwright.
      - name: Install Flutter for the shared E2E web host
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/Google/Flutter/app
        run: flutter pub get --enforce-lockfile

      # The shared E2E host compiles the shell at boot; warming the release web build here, with
      # its incremental caches kept across runs, turns that in-test compile into minutes.
      - name: Cache the shell web build
        uses: actions/cache@v6
        with:
          path: |
            src/Modules/Google/Flutter/app/**/.dart_tool
            src/Modules/Google/Flutter/app/shell/build
          key: ${{ runner.os }}-fluttershell-${{ hashFiles('src/Modules/Google/Flutter/app/pubspec.lock') }}-${{ hashFiles('src/Modules/Google/Flutter/app/**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-fluttershell-${{ hashFiles('src/Modules/Google/Flutter/app/pubspec.lock') }}-
            ${{ runner.os }}-fluttershell-

      - name: Warm the shell web build
        working-directory: src/Modules/Google/Flutter/app/shell
        run: flutter build web --release

      - name: Install Playwright browser and system dependencies
        run: pwsh src/IntoChat/tests/IntoChat.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      # One deterministic build primes the docker layer cache, so the sandbox the E2E hosts
      # start on demand comes up in seconds instead of spending its test budget on the build.
      - name: Prime the C# sandbox image build cache
        run: docker build src/Modules/Microsoft/CSharp/DigitalBrain.Modules.Microsoft.CSharp.Sandbox

      # Scripts restore inside the sandbox against its named NuGet volume; seeding it from the
      # host's packages (already restored for the solution) removes every in-sandbox download.
      - name: Seed the sandbox NuGet volume
        run: docker run --rm -v digitalbrain-csharp-nuget:/root/.nuget/packages -v $HOME/.nuget/packages:/seed:ro alpine sh -c "cp -a /seed/. /root/.nuget/packages/"

      # One module at a time: the shared E2E host compiles the web shell and the sandbox
      # E2E builds containers; running them beside other suites starves both on a small runner.
      - name: Test
        run: dotnet test DigitalBrain.slnx -c Release --no-build -v quiet --max-parallel-test-modules 1
        env:
          DIGITALBRAIN_E2E_LIVE_MODEL: '0'
          DIGITALBRAIN_E2E_HEADED: '0'

  flutter-web-build:
    name: Flutter analyze and web build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src/Modules/Google/Flutter/app/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/Google/Flutter/app
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/Modules/Google/Flutter/app
        run: dart format --output=none --set-exit-if-changed core ui shell

      - name: Analyze Flutter packages
        working-directory: src/Modules/Google/Flutter/app
        run: |
          (cd core && dart analyze --fatal-infos)
          (cd ui && flutter analyze --no-pub)
          (cd shell && flutter analyze --no-pub)

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub

      - name: Flutter widget and client tests
        working-directory: src/Modules/Google/Flutter/app
        run: |
          (cd ui && flutter test --no-pub)
          (cd shell && flutter test --no-pub)
