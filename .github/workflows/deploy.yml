name: deploy

# Deployment is release-gated: publish a GitHub Release to build the images and run Pulumi.
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      TAG: "${{ github.event.release.tag_name }}"
      WEB_CUSTOM_HOSTNAME: "${{ vars.DIGITALBRAIN_WEB_HOSTNAME || 'www.digitalbrain.tech' }}"
      WEB_APEX_HOSTNAME: "${{ vars.DIGITALBRAIN_WEB_APEX_HOSTNAME || 'digitalbrain.tech' }}"
      KERNEL_CUSTOM_HOSTNAME: "${{ vars.DIGITALBRAIN_KERNEL_HOSTNAME || 'api.digitalbrain.tech' }}"
      MCP_CUSTOM_HOSTNAME: "${{ vars.DIGITALBRAIN_MCP_HOSTNAME || 'mcp.digitalbrain.tech' }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - run: dotnet restore Brain.slnx

      - run: dotnet restore deploy/DigitalBrain.Deploy.csproj

      - run: dotnet format whitespace Brain.slnx --verify-no-changes --no-restore --verbosity minimal

      - run: dotnet format whitespace deploy/DigitalBrain.Deploy.csproj --verify-no-changes --no-restore --verbosity minimal

      - run: dotnet build deploy/DigitalBrain.Deploy.csproj --no-restore

      - name: Run tests
        run: dotnet test --logger "console;verbosity=minimal"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kernel image
        run: |
          dotnet publish src/DigitalBrain.Kernel/DigitalBrain.Kernel.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-kernel \
            -p:ContainerImageTag="${TAG}"

      - name: Publish MCP image
        run: |
          dotnet publish src/DigitalBrain.Mcp/DigitalBrain.Mcp.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-mcp \
            -p:ContainerImageTag="${TAG}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision (pulumi up)
        uses: pulumi/actions@v6
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
          DIGITALBRAIN_IMAGE_TAG: "${{ env.TAG }}"
          # AES checkpoint-encryption key, injected from a repo secret (never committed). The program reads
          # DIGITALBRAIN_CHECKPOINT_KEY and fails the deploy if absent (kernel fail-fasts in Production without it).
          DIGITALBRAIN_CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          DIGITALBRAIN_SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
          DIGITALBRAIN_RUNTIME_STATE_KEK: ${{ secrets.RUNTIME_STATE_KEK }}
          DIGITALBRAIN_RUNTIME_STATE_SIGNING_KEY: ${{ secrets.RUNTIME_STATE_SIGNING_KEY }}
          DIGITALBRAIN_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          DIGITALBRAIN_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DIGITALBRAIN_GOOGLE_REDIRECT_URI: ${{ vars.DIGITALBRAIN_GOOGLE_REDIRECT_URI }}
          DIGITALBRAIN_SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          DIGITALBRAIN_SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          DIGITALBRAIN_SALESFORCE_REDIRECT_URI: ${{ vars.DIGITALBRAIN_SALESFORCE_REDIRECT_URI }}
          DIGITALBRAIN_OIDC_ISSUER: ${{ vars.DIGITALBRAIN_OIDC_ISSUER }}
          DIGITALBRAIN_OIDC_AUDIENCE: ${{ vars.DIGITALBRAIN_OIDC_AUDIENCE }}
          DIGITALBRAIN_MCP_AUDIENCE: ${{ vars.DIGITALBRAIN_MCP_AUDIENCE }}
          DIGITALBRAIN_UI_AUDIENCE: ${{ vars.DIGITALBRAIN_UI_AUDIENCE }}
          # Docker Hub PAT so ACA can authenticate pulling the private runtime images (see
          # deploy/Program.cs's RegistryCredentialsArgs wiring).
          DIGITALBRAIN_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DIGITALBRAIN_DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DIGITALBRAIN_WEB_HOSTNAME: ${{ env.WEB_CUSTOM_HOSTNAME }}
          DIGITALBRAIN_WEB_APEX_HOSTNAME: ${{ env.WEB_APEX_HOSTNAME }}
          DIGITALBRAIN_KERNEL_HOSTNAME: ${{ env.KERNEL_CUSTOM_HOSTNAME }}
          DIGITALBRAIN_MCP_HOSTNAME: ${{ env.MCP_CUSTOM_HOSTNAME }}
          # azblob://pulumi-state backend needs the storage account; the OIDC login above provides Azure AD auth
          # (the deploy identity needs Storage Blob Data Contributor on this account).
          AZURE_STORAGE_ACCOUNT: digitalbrainstprod
        with:
          command: up
          stack-name: dev
          work-dir: deploy
          cloud-url: azblob://pulumi-state

      - name: Capture stable MCP FQDN
        id: mcp_fqdn
        run: |
          fqdn=$(az containerapp show --name digitalbrain-mcp --resource-group digitalbrain-rg --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Ensure Azure Static Web App
        id: swa
        shell: bash
        run: |
          set -euo pipefail
          if ! az staticwebapp show --name digitalbrain-web-prod --resource-group digitalbrain-rg >/dev/null 2>&1; then
            az staticwebapp create \
              --name digitalbrain-web-prod \
              --resource-group digitalbrain-rg \
              --location westeurope \
              --sku Free \
              --tags Environment=prod Project=Application Owner=Application-DevOps CorrelationId=unknown CreatedBy=GitHubActions ManagedBy=GitHubActions ResourceType=static-web-app >/dev/null
          fi

          token=$(az staticwebapp secrets list --name digitalbrain-web-prod --resource-group digitalbrain-rg --query "properties.apiKey" -o tsv)
          hostname=$(az staticwebapp show --name digitalbrain-web-prod --resource-group digitalbrain-rg --query "defaultHostname" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"

      - name: Ensure production custom domains
        shell: bash
        run: |
          set -euo pipefail

          ensure_container_app_hostname() {
            local app_name="$1"
            local hostname="$2"
            local binding_type

            echo "Ensuring Container Apps hostname ${hostname} on ${app_name}..."
            binding_type=$(az containerapp hostname list \
              --name "${app_name}" \
              --resource-group digitalbrain-rg \
              --query "[?name=='${hostname}'].bindingType | [0]" \
              -o tsv)

            if [ -z "${binding_type}" ]; then
              az containerapp hostname add \
                --name "${app_name}" \
                --resource-group digitalbrain-rg \
                --hostname "${hostname}" >/dev/null
              binding_type="Disabled"
            fi

            if [ "${binding_type}" != "SniEnabled" ]; then
              az containerapp hostname bind \
                --name "${app_name}" \
                --resource-group digitalbrain-rg \
                --environment digitalbrain-cae-prod \
                --hostname "${hostname}" \
                --validation-method CNAME >/dev/null
            fi
          }

          # The kernel hostname remains only for its existing OAuth start/callback routes.
          ensure_container_app_hostname digitalbrain-jobs "${KERNEL_CUSTOM_HOSTNAME}"
          ensure_container_app_hostname digitalbrain-mcp "${MCP_CUSTOM_HOSTNAME}"

          get_swa_hostname_status() {
            local hostname="$1"
            az staticwebapp hostname show \
              --name digitalbrain-web-prod \
              --resource-group digitalbrain-rg \
              --hostname "${hostname}" \
              --query "status" \
              -o tsv 2>/dev/null || true
          }

          ensure_swa_hostname() {
            local hostname="$1"
            local swa_hostname_status

            echo "Ensuring Static Web Apps hostname ${hostname}..."
            swa_hostname_status=$(get_swa_hostname_status "${hostname}")

            if [ "${swa_hostname_status}" = "Failed" ]; then
              echo "Static Web Apps hostname ${hostname} is Failed; deleting it before retrying validation."
              az staticwebapp hostname delete \
                --name digitalbrain-web-prod \
                --resource-group digitalbrain-rg \
                --hostname "${hostname}" \
                --no-wait \
                --yes >/dev/null
              swa_hostname_status="Deleting"
            fi

            if [ "${swa_hostname_status}" = "Deleting" ]; then
              echo "Static Web Apps hostname ${hostname} is deleting; waiting before retrying validation."
              for i in $(seq 1 40); do
                sleep 30
                swa_hostname_status=$(get_swa_hostname_status "${hostname}")
                if [ "${swa_hostname_status}" != "Deleting" ]; then
                  break
                fi
                echo "Attempt $i: ${hostname} still deleting."
              done

              if [ "${swa_hostname_status}" = "Deleting" ]; then
                echo "Static Web Apps hostname ${hostname} deletion did not finish within 20 minutes." >&2
                exit 1
              fi
            fi

            if [ -z "${swa_hostname_status}" ] || [ "${swa_hostname_status}" != "Ready" ]; then
              echo "Static Web Apps hostname ${hostname} status is '${swa_hostname_status:-missing}'; requesting TXT validation."
              az staticwebapp hostname set \
                --name digitalbrain-web-prod \
                --resource-group digitalbrain-rg \
                --hostname "${hostname}" \
                --validation-method dns-txt-token \
                --no-wait >/dev/null
            fi

            for i in $(seq 1 60); do
              swa_hostname_status=$(get_swa_hostname_status "${hostname}")
              if [ "${swa_hostname_status}" = "Ready" ]; then
                echo "Static Web Apps hostname ${hostname} is ready."
                break
              fi
              if [ "${swa_hostname_status}" = "Failed" ]; then
                az staticwebapp hostname show \
                  --name digitalbrain-web-prod \
                  --resource-group digitalbrain-rg \
                  --hostname "${hostname}" \
                  --query "{status:status,error:errorMessage,validationToken:validationToken}" \
                  -o json >&2
                echo "Expected Static Web Apps DNS TXT validation token is shown above; make sure it exists in authoritative DNS." >&2
                exit 1
              fi
              echo "Attempt $i: Static Web Apps hostname ${hostname} status is '${swa_hostname_status:-missing}', waiting for Ready."
              sleep 30
            done

            if [ "${swa_hostname_status}" != "Ready" ]; then
              echo "Static Web Apps hostname ${hostname} did not become Ready within 30 minutes." >&2
              exit 1
            fi
          }

          ensure_swa_hostname "${WEB_CUSTOM_HOSTNAME}"
          if [ "${WEB_APEX_HOSTNAME}" != "${WEB_CUSTOM_HOSTNAME}" ]; then
            ensure_swa_hostname "${WEB_APEX_HOSTNAME}"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

      - run: flutter test
        working-directory: app

      # Served at the custom domain root, so base href is "/". Flutter's default
      # hash URL strategy resolves routes client-side without a custom 404.html.
      # --no-tree-shake-icons: the app uses non-constant IconData, which blocks icon tree-shaking.
      # Flutter distribution is wired EXCLUSIVELY to the authenticated MCP UI transport (gRPC over HTTPS with x-v2-audience + session).
      # Kernel is used only for OAuth callbacks; no direct kernel references allowed in the bundle (enforced by smoke tests).
      - run: |
          mcp_endpoint="https://${MCP_CUSTOM_HOSTNAME}"
          flutter build web --release --base-href "/" --no-tree-shake-icons --no-wasm-dry-run \
            --dart-define=DIGITALBRAIN_V2_UI_ENDPOINT="${mcp_endpoint}" \
            --dart-define=DIGITALBRAIN_OIDC_ISSUER="${{ vars.DIGITALBRAIN_OIDC_ISSUER }}" \
            --dart-define=DIGITALBRAIN_OIDC_CLIENT_ID="${{ vars.DIGITALBRAIN_OIDC_AUDIENCE }}"
        working-directory: app

      - name: Deploy Flutter web to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/build/web
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Generated MCP FQDN health smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ steps.mcp_fqdn.outputs.fqdn }}/health"; then
              echo "MCP healthy."
              exit 0
            fi
            echo "Attempt $i: MCP not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "MCP did not become healthy within 100s." >&2
          exit 1

      - name: Custom MCP domain health smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://${MCP_CUSTOM_HOSTNAME}/health"; then
              echo "Custom MCP domain healthy."
              exit 0
            fi
            echo "Attempt $i: custom MCP domain not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Custom MCP domain did not become healthy within 150s." >&2
          exit 1

      - name: Static Web Apps smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsSI "https://${{ steps.swa.outputs.hostname }}/" >/dev/null; then
              echo "Static Web App healthy."
              exit 0
            fi
            echo "Attempt $i: static web app not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Static Web App did not become reachable within 100s." >&2
          exit 1

      - name: Custom Static Web Apps smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsSI "https://${WEB_CUSTOM_HOSTNAME}/" >/dev/null; then
              echo "Custom Static Web App domain healthy."
              exit 0
            fi
            echo "Attempt $i: custom static web app domain not ready yet, retrying in 15s..."
            sleep 15
          done
          echo "Custom Static Web App domain did not become reachable within 300s." >&2
          exit 1

      - name: Flutter MCP endpoint smoke test
        run: |
          set -euo pipefail
          js=$(mktemp)
          curl -fsS "https://${WEB_CUSTOM_HOSTNAME}/main.dart.js" -o "$js"

          if ! grep -F "https://${MCP_CUSTOM_HOSTNAME}" "$js" >/dev/null; then
            echo "Flutter bundle does not contain the custom MCP endpoint." >&2
            exit 1
          fi

          generated_endpoint="https://${{ steps.mcp_fqdn.outputs.fqdn }}"
          if grep -F "$generated_endpoint" "$js" >/dev/null; then
            echo "Flutter bundle still contains the generated Container App endpoint." >&2
            exit 1
          fi

          if grep -F "https://${KERNEL_CUSTOM_HOSTNAME}" "$js" >/dev/null; then
            echo "Flutter bundle still contains the kernel endpoint; MCP must be its sole runtime endpoint." >&2
            exit 1
          fi
