name: deploy

# Deployment is release-gated: publish a GitHub Release to build the images and run Pulumi.
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      TAG: "${{ github.event.release.tag_name }}"
      WEB_CUSTOM_HOSTNAME: "${{ vars.DIGITALBRAIN_WEB_HOSTNAME || 'www.digitalbrain.tech' }}"
      WEB_APEX_HOSTNAME: "${{ vars.DIGITALBRAIN_WEB_APEX_HOSTNAME || 'digitalbrain.tech' }}"
      KERNEL_CUSTOM_HOSTNAME: "${{ vars.DIGITALBRAIN_KERNEL_HOSTNAME || 'api.digitalbrain.tech' }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - run: dotnet restore Brain.slnx

      - run: dotnet format whitespace Brain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Run tests
        run: dotnet test Brain.slnx --no-restore

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kernel image
        run: |
          dotnet publish src/DigitalBrain.Kernel/DigitalBrain.Kernel.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-kernel \
            -p:ContainerImageTag="${TAG}"

      - name: Publish Telegram transport image
        run: |
          dotnet publish hosts/DigitalBrain.Telegram.Transport/DigitalBrain.Telegram.Transport.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-telegram \
            -p:ContainerImageTag="${TAG}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision (pulumi up)
        uses: pulumi/actions@v6
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
          DIGITALBRAIN_IMAGE_TAG: "${{ env.TAG }}"
          # AES checkpoint-encryption key, injected from a repo secret (never committed). The program reads
          # DIGITALBRAIN_CHECKPOINT_KEY and fails the deploy if absent (kernel fail-fasts in Production without it).
          DIGITALBRAIN_CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          # Docker Hub PAT so ACA can authenticate pulling the private kernel/telegram images (see
          # deploy/Program.cs's RegistryCredentialsArgs wiring).
          DIGITALBRAIN_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DIGITALBRAIN_WEB_HOSTNAME: ${{ env.WEB_CUSTOM_HOSTNAME }}
          DIGITALBRAIN_WEB_APEX_HOSTNAME: ${{ env.WEB_APEX_HOSTNAME }}
          DIGITALBRAIN_KERNEL_HOSTNAME: ${{ env.KERNEL_CUSTOM_HOSTNAME }}
          # azblob://pulumi-state backend needs the storage account; the OIDC login above provides Azure AD auth
          # (the deploy identity needs Storage Blob Data Contributor on this account).
          AZURE_STORAGE_ACCOUNT: digitalbrainstprod
        with:
          command: up
          stack-name: dev
          work-dir: deploy
          cloud-url: azblob://pulumi-state

      - name: Capture stable kernel FQDN
        id: kernel_fqdn
        run: |
          fqdn=$(az containerapp show --name digitalbrain-jobs --resource-group digitalbrain-rg --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Ensure Azure Static Web App
        id: swa
        shell: bash
        run: |
          set -euo pipefail
          if ! az staticwebapp show --name digitalbrain-web-prod --resource-group digitalbrain-rg >/dev/null 2>&1; then
            az staticwebapp create \
              --name digitalbrain-web-prod \
              --resource-group digitalbrain-rg \
              --location westeurope \
              --sku Free \
              --tags Environment=prod Project=Application Owner=Application-DevOps CorrelationId=unknown CreatedBy=GitHubActions ManagedBy=GitHubActions ResourceType=static-web-app >/dev/null
          fi

          token=$(az staticwebapp secrets list --name digitalbrain-web-prod --resource-group digitalbrain-rg --query "properties.apiKey" -o tsv)
          hostname=$(az staticwebapp show --name digitalbrain-web-prod --resource-group digitalbrain-rg --query "defaultHostname" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"

      - name: Ensure production custom domains
        shell: bash
        run: |
          set -euo pipefail

          echo "Ensuring Container Apps hostname ${KERNEL_CUSTOM_HOSTNAME}..."
          binding_type=$(az containerapp hostname list \
            --name digitalbrain-jobs \
            --resource-group digitalbrain-rg \
            --query "[?name=='${KERNEL_CUSTOM_HOSTNAME}'].bindingType | [0]" \
            -o tsv)

          if [ -z "${binding_type}" ]; then
            az containerapp hostname add \
              --name digitalbrain-jobs \
              --resource-group digitalbrain-rg \
              --hostname "${KERNEL_CUSTOM_HOSTNAME}" >/dev/null
            binding_type="Disabled"
          fi

          if [ "${binding_type}" != "SniEnabled" ]; then
            az containerapp hostname bind \
              --name digitalbrain-jobs \
              --resource-group digitalbrain-rg \
              --environment digitalbrain-cae-prod \
              --hostname "${KERNEL_CUSTOM_HOSTNAME}" \
              --validation-method CNAME >/dev/null
          fi

          echo "Ensuring Static Web Apps hostname ${WEB_CUSTOM_HOSTNAME}..."
          get_swa_hostname_status() {
            az staticwebapp hostname show \
              --name digitalbrain-web-prod \
              --resource-group digitalbrain-rg \
              --hostname "${WEB_CUSTOM_HOSTNAME}" \
              --query "status" \
              -o tsv 2>/dev/null || true
          }

          swa_hostname_status=$(get_swa_hostname_status)

          if [ "${swa_hostname_status}" = "Failed" ]; then
            echo "Static Web Apps hostname is Failed; deleting it before retrying validation."
            az staticwebapp hostname delete \
              --name digitalbrain-web-prod \
              --resource-group digitalbrain-rg \
              --hostname "${WEB_CUSTOM_HOSTNAME}" \
              --no-wait \
              --yes >/dev/null
            swa_hostname_status="Deleting"
          fi

          if [ "${swa_hostname_status}" = "Deleting" ]; then
            echo "Static Web Apps hostname is deleting; waiting before retrying validation."
            for i in $(seq 1 40); do
              sleep 30
              swa_hostname_status=$(get_swa_hostname_status)
              if [ "${swa_hostname_status}" != "Deleting" ]; then
                break
              fi
              echo "Attempt $i: hostname still deleting."
            done

            if [ "${swa_hostname_status}" = "Deleting" ]; then
              echo "Static Web Apps hostname deletion did not finish within 20 minutes." >&2
              exit 1
            fi
          fi

          if [ -z "${swa_hostname_status}" ] || [ "${swa_hostname_status}" != "Ready" ]; then
            echo "Static Web Apps hostname status is '${swa_hostname_status:-missing}'; requesting CNAME validation."
            az staticwebapp hostname set \
              --name digitalbrain-web-prod \
              --resource-group digitalbrain-rg \
              --hostname "${WEB_CUSTOM_HOSTNAME}" \
              --validation-method cname-delegation \
              --no-wait >/dev/null
          fi

          for i in $(seq 1 60); do
            swa_hostname_status=$(get_swa_hostname_status)
            if [ "${swa_hostname_status}" = "Ready" ]; then
              echo "Static Web Apps hostname is ready."
              break
            fi
            if [ "${swa_hostname_status}" = "Failed" ]; then
              az staticwebapp hostname show \
                --name digitalbrain-web-prod \
                --resource-group digitalbrain-rg \
                --hostname "${WEB_CUSTOM_HOSTNAME}" \
                --query "{status:status,error:errorMessage}" \
                -o json >&2
              exit 1
            fi
            echo "Attempt $i: Static Web Apps hostname status is '${swa_hostname_status:-missing}', waiting for Ready."
            sleep 30
          done

          if [ "${swa_hostname_status}" != "Ready" ]; then
            echo "Static Web Apps hostname did not become Ready within 30 minutes." >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      # Served at the custom domain root, so base href is "/". Flutter's default
      # hash URL strategy resolves routes client-side without a custom 404.html.
      # --no-tree-shake-icons: the app uses non-constant IconData, which blocks icon tree-shaking.
      - run: |
          kernel_endpoint="https://${KERNEL_CUSTOM_HOSTNAME}"
          flutter build web --release --base-href "/" --no-tree-shake-icons --no-wasm-dry-run \
            --dart-define=KERNEL_ENDPOINT="${kernel_endpoint}" \
            --dart-define=KERNEL_UPLOAD_ENDPOINT="${kernel_endpoint}"
        working-directory: app

      - name: Deploy Flutter web to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/build/web
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Generated kernel FQDN smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ steps.kernel_fqdn.outputs.fqdn }}/health"; then
              echo "Kernel healthy."
              exit 0
            fi
            echo "Attempt $i: kernel not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Kernel did not become healthy within 100s." >&2
          exit 1

      - name: Custom kernel domain smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://${KERNEL_CUSTOM_HOSTNAME}/health"; then
              echo "Custom kernel domain healthy."
              exit 0
            fi
            echo "Attempt $i: custom kernel domain not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Custom kernel domain did not become healthy within 150s." >&2
          exit 1

      - name: Browser CORS smoke test
        run: |
          set -euo pipefail
          for origin in "https://${WEB_APEX_HOSTNAME}" "https://${WEB_CUSTOM_HOSTNAME}"; do
            headers=$(mktemp)
            curl -fsS -o /dev/null -D "$headers" -X OPTIONS \
              "https://${KERNEL_CUSTOM_HOSTNAME}/digitalbrain.DigitalBrainGateway/Health" \
              -H "Origin: ${origin}" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type,x-grpc-web"
            if ! tr -d '\r' < "$headers" | grep -i -F "access-control-allow-origin: ${origin}" >/dev/null; then
              echo "CORS preflight did not allow ${origin}." >&2
              cat "$headers" >&2
              exit 1
            fi
          done

      - name: Static Web Apps smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsSI "https://${{ steps.swa.outputs.hostname }}/" >/dev/null; then
              echo "Static Web App healthy."
              exit 0
            fi
            echo "Attempt $i: static web app not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Static Web App did not become reachable within 100s." >&2
          exit 1

      - name: Custom Static Web Apps smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsSI "https://${WEB_CUSTOM_HOSTNAME}/" >/dev/null; then
              echo "Custom Static Web App domain healthy."
              exit 0
            fi
            echo "Attempt $i: custom static web app domain not ready yet, retrying in 15s..."
            sleep 15
          done
          echo "Custom Static Web App domain did not become reachable within 300s." >&2
          exit 1

      - name: Flutter endpoint smoke test
        run: |
          set -euo pipefail
          js=$(mktemp)
          curl -fsS "https://${WEB_CUSTOM_HOSTNAME}/main.dart.js" -o "$js"

          if ! grep -F "https://${KERNEL_CUSTOM_HOSTNAME}" "$js" >/dev/null; then
            echo "Flutter bundle does not contain the custom kernel endpoint." >&2
            exit 1
          fi

          generated_endpoint="https://${{ steps.kernel_fqdn.outputs.fqdn }}"
          if grep -F "$generated_endpoint" "$js" >/dev/null; then
            echo "Flutter bundle still contains the generated Container App endpoint." >&2
            exit 1
          fi
