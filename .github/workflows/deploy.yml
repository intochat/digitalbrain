name: deploy

# Auto-deploy on merge to master. The simplified Pass-1 flow currently builds and pushes the kernel
# image, then runs `pulumi up` for the minimal runtime stack.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to build and deploy'
        required: false
        default: 'latest'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: "${{ inputs.image_tag || github.sha }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Run tests
        run: dotnet test Brain.slnx -c Release -p:SkipFlutterBuild=true --filter "FullyQualifiedName!~E2E"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish kernel image
        run: |
          dotnet publish DigitalBrain.Kernel/DigitalBrain.Kernel.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=digitalbraintech/digitalbrain-kernel \
            -p:ContainerImageTag="${TAG}"

      - name: Publish Telegram transport image
        run: |
          dotnet publish DigitalBrain.Telegram.Transport/DigitalBrain.Telegram.Transport.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=digitalbraintech/digitalbrain-telegram \
            -p:ContainerImageTag="${TAG}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision (pulumi up)
        uses: pulumi/actions@v6
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
          DIGITALBRAIN_IMAGE_TAG: "${{ env.TAG }}"
          # AES checkpoint-encryption key, injected from a repo secret (never committed). The program reads
          # DIGITALBRAIN_CHECKPOINT_KEY and fails the deploy if absent (kernel fail-fasts in Production without it).
          DIGITALBRAIN_CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          # azblob://pulumi-state backend needs the storage account; the OIDC login above provides Azure AD auth
          # (the deploy identity needs Storage Blob Data Contributor on this account).
          AZURE_STORAGE_ACCOUNT: digitalbrainstprod
        with:
          command: up
          stack-name: dev
          work-dir: deploy
          cloud-url: azblob://pulumi-state

      - name: Capture kernel FQDN
        id: kernel_fqdn
        working-directory: deploy
        run: echo "fqdn=$(pulumi stack output kernelFqdn --stack dev)" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
          AZURE_STORAGE_ACCOUNT: digitalbrainstprod

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ steps.kernel_fqdn.outputs.fqdn }}/health"; then
              echo "Kernel healthy."
              exit 0
            fi
            echo "Attempt $i: kernel not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Kernel did not become healthy within 100s." >&2
          exit 1
