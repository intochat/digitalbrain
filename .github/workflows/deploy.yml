name: deploy

# Release-gated Flutter web deployment and kernel image publication.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish-kernel-image:
    name: Publish kernel image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kernel image
        env:
          ContainerImageTags: ${{ github.event.release.tag_name }};latest
        run: |
          dotnet publish src/Kernel/DigitalBrain.Kernel/DigitalBrain.Kernel.csproj \
            -c Release -r linux-x64 /t:PublishContainer \
            -p:PublishProfile=Container \
            -p:EnableSdkContainerSupport=true \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-kernel

      # MCP image publication remains intentionally commented out for now.
      #
      # - name: Publish MCP image
      #   env:
      #     ContainerImageTags: ${{ github.event.release.tag_name }};latest
      #   run: |
      #     dotnet publish src/Kernel/DigitalBrain.Mcp/DigitalBrain.Mcp.csproj \
      #       -c Release -r linux-x64 /t:PublishContainer \
      #       -p:PublishProfile=Container \
      #       -p:EnableSdkContainerSupport=true \
      #       -p:ContainerRegistry=docker.io \
      #       -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-mcp

  deploy-flutter-web:
    name: Deploy Flutter web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://purple-sky-0f80f110f.7.azurestaticapps.net/
    defaults:
      run:
        working-directory: src/Modules/UI/Flutter/shell
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Resolve Flutter workspace
        working-directory: src/Modules/UI/Flutter
        run: flutter pub get --enforce-lockfile

      - name: Dart format
        working-directory: src/Modules/UI/Flutter
        run: dart format --output=none --set-exit-if-changed core kit shell

      - name: Core package tests
        working-directory: src/Modules/UI/Flutter/core
        run: dart test

      - name: Kit package tests
        working-directory: src/Modules/UI/Flutter/kit
        run: flutter test --no-pub

      - name: Shell tests
        run: flutter test --no-pub

      - name: Web release build
        run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-pub

      - name: Deploy Flutter web
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/Modules/UI/Flutter/shell/build/web
          api_location: ''
          output_location: ''
          skip_app_build: true
