name: deploy

# Deployment is release-gated: publish a GitHub Release to build the images and run Pulumi.
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      TAG: "${{ github.event.release.tag_name }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - run: dotnet restore Brain.slnx

      - run: dotnet format whitespace Brain.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Run tests
        run: dotnet test Brain.slnx --no-restore

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kernel image
        run: |
          dotnet publish src/DigitalBrain.Kernel/DigitalBrain.Kernel.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-kernel \
            -p:ContainerImageTag="${TAG}"

      - name: Publish Telegram transport image
        run: |
          dotnet publish hosts/DigitalBrain.Telegram.Transport/DigitalBrain.Telegram.Transport.csproj -c Release /t:PublishContainer \
            -p:ContainerRegistry=docker.io \
            -p:ContainerRepository=${{ vars.DOCKERHUB_USERNAME }}/digitalbrain-telegram \
            -p:ContainerImageTag="${TAG}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision (pulumi up)
        uses: pulumi/actions@v6
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
          DIGITALBRAIN_IMAGE_TAG: "${{ env.TAG }}"
          # AES checkpoint-encryption key, injected from a repo secret (never committed). The program reads
          # DIGITALBRAIN_CHECKPOINT_KEY and fails the deploy if absent (kernel fail-fasts in Production without it).
          DIGITALBRAIN_CHECKPOINT_KEY: ${{ secrets.CHECKPOINT_KEY }}
          # Docker Hub PAT so ACA can authenticate pulling the private kernel/telegram images (see
          # deploy/Program.cs's RegistryCredentialsArgs wiring).
          DIGITALBRAIN_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # azblob://pulumi-state backend needs the storage account; the OIDC login above provides Azure AD auth
          # (the deploy identity needs Storage Blob Data Contributor on this account).
          AZURE_STORAGE_ACCOUNT: digitalbrainstprod
        with:
          command: up
          stack-name: dev
          work-dir: deploy
          cloud-url: azblob://pulumi-state

      - name: Capture kernel FQDN
        id: kernel_fqdn
        working-directory: deploy
        run: |
          fqdn=$(pulumi stack output kernelFqdn --stack dev)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
          PULUMI_BACKEND_URL: azblob://pulumi-state
          AZURE_STORAGE_ACCOUNT: digitalbrainstprod

      - name: Capture Static Web Apps deployment settings
        id: swa
        working-directory: deploy
        run: |
          token=$(pulumi stack output swaDeploymentToken --stack dev --show-secrets)
          hostname=$(pulumi stack output swaDefaultHostname --stack dev)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
          PULUMI_BACKEND_URL: azblob://pulumi-state
          AZURE_STORAGE_ACCOUNT: digitalbrainstprod

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      # Served at the apex custom domain, so base href is "/". Flutter's default
      # hash URL strategy resolves routes client-side without a custom 404.html.
      # --no-tree-shake-icons: the app uses non-constant IconData, which blocks icon tree-shaking.
      - run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-wasm-dry-run
        working-directory: app

      - name: Deploy Flutter web to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/build/web
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ steps.kernel_fqdn.outputs.fqdn }}/health"; then
              echo "Kernel healthy."
              exit 0
            fi
            echo "Attempt $i: kernel not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Kernel did not become healthy within 100s." >&2
          exit 1

      - name: Static Web Apps smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsSI "https://${{ steps.swa.outputs.hostname }}/" >/dev/null; then
              echo "Static Web App healthy."
              exit 0
            fi
            echo "Attempt $i: static web app not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Static Web App did not become reachable within 100s." >&2
          exit 1
