name: Deploy Flutter Web

# Builds the DigitalBrain Flutter client from app/ and publishes it to Azure Static Web Apps
# (digitalbrain-web-prod, provisioned by deploy/Program.cs), which serves the custom apex domain
# digitalbrain.tech once DNS cutover completes (see docs/ARCHITECTURE-AND-PRODUCTION-PLAN.md M9 Task 17).

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-flutter-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      # Served at the apex custom domain, so base href is "/". Flutter's default
      # hash URL strategy resolves routes client-side without a custom 404.html.
      # --no-tree-shake-icons: the app uses non-constant IconData, which blocks icon tree-shaking.
      - run: flutter build web --release --base-href "/" --no-tree-shake-icons --no-wasm-dry-run
        working-directory: app

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/build/web
          api_location: ""
          output_location: ""
          skip_app_build: true
