# IntoChat hosted telemetry pipeline.
#
# The product profile emits OTLP to this collector; the collector tail-samples and forwards to a
# persistent backend. Receipts are durable records and are never derived from this pipeline.
#
# Run (hosted):  otelcol --config ops/otel/collector.yaml
# Required env:
#   OTEL_BACKEND_ENDPOINT   OTLP/HTTP endpoint of the persistent backend (e.g. an Azure Monitor
#                           data-collection endpoint, or a self-hosted Tempo/Loki/OTLP sink)
#   OTEL_BACKEND_HEADERS    optional headers, e.g. "authorization=Bearer ..."
#
# Tail sampling keeps every failed or slow intent and a sample of healthy traffic, so the
# per-intent trace stays intact while the idle shell stops costing storage.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 15

  # Tail sampling decides after the whole trace is seen, so a decision can use the outcome.
  tail_sampling:
    decision_wait: 15s
    num_traces: 100000
    expected_new_traces_per_sec: 50
    policies:
      # Always keep errors and platform faults.
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Always keep slow requests (SLO 99.5% monthly on /agent and window reads).
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      # Keep every intent that carried IntoChat attributes, even when healthy.
      - name: intochat-intents
        type: string_attribute
        string_attribute:
          key: intochat.intent.id
          values: [".+"]
          enabled_regex_matching: true
          invert_match: false
      # Sample the remaining healthy traffic.
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  batch:
    timeout: 5s
    send_batch_size: 512

  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT:-production}
        action: upsert

exporters:
  # Persistent telemetry backend target. Set OTEL_BACKEND_ENDPOINT in the hosted deployment.
  otlphttp/backend:
    endpoint: ${env:OTEL_BACKEND_ENDPOINT}
    headers:
      ${env:OTEL_BACKEND_HEADERS:-X-IntoChat-Source=collector}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    sending_queue:
      enabled: true
      queue_size: 5000

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, resource, batch]
      exporters: [otlphttp/backend]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/backend]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/backend]
