# Nightly backup jobs (C17). Apply to the hosted cluster: kubectl apply -f ops/backup/nightly-backup.yaml
#
# Three independent jobs, all at 02:00 UTC (RPO 24h, RTO 4h):
#   1. grain-storage  — Orleans grain state container snapshot (Azure Blob copy to the restore container)
#   2. ledger         — Compute ledger PostgreSQL logical dump
#   3. qdrant         — Qdrant collection snapshot
#
# Secrets are read from the intochat-ops secret; no credentials live in this file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: intochat-backup-grain-storage
  labels: { app.kubernetes.io/part-of: intochat, intochat.backup/target: grain-storage }
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: grain-storage
              image: mcr.microsoft.com/azure-cli:latest
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  az storage blob copy start-batch
                  --source-account-name "$STORAGE_ACCOUNT"
                  --source-container digitalbrain-v2-state
                  --destination-account-name "$STORAGE_ACCOUNT"
                  --destination-container digitalbrain-v2-state-restore
                  --dest-sas "$STORAGE_RESTORE_SAS"
              envFrom:
                - secretRef: { name: intochat-ops }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: intochat-backup-ledger
  labels: { app.kubernetes.io/part-of: intochat, intochat.backup/target: ledger }
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ledger
              image: postgres:17-alpine
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  pg_dump --format=custom --no-owner --file=/backup/ledger.dump "$LEDGER_DATABASE_URL"
              envFrom:
                - secretRef: { name: intochat-ops }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: intochat-backup }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: intochat-backup-qdrant
  labels: { app.kubernetes.io/part-of: intochat, intochat.backup/target: qdrant }
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: qdrant
              image: curlimages/curl:latest
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  curl -fsS -X POST "$QDRANT_URL/collections/$QDRANT_COLLECTION/snapshots"
                  -H "api-key: $QDRANT_API_KEY"
                  -o /backup/qdrant.snapshot
              envFrom:
                - secretRef: { name: intochat-ops }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: intochat-backup }
