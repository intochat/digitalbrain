[mcp_servers.aspire]
command = "aspire"
args = [
    "agent",
    "mcp",
]

[mcp_servers.codegraph]
command = "npx"
args = [
    "-y",
    "@colbymchenry/codegraph",
    "serve",
    "--mcp",
]

[mcp_servers.context7]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@upstash/context7-mcp@latest",
]

[mcp_servers.digitalbrain]
command = "dotnet"
args = [
    "run",
    "--no-build",
    "--project",
    "src/DigitalBrain.Mcp/DigitalBrain.Mcp.csproj",
    "--no-launch-profile",
]

[mcp_servers.digitalbrain.env]
DOTNET_ENVIRONMENT = "Development"

[mcp_servers.digitalbrain-http]
url = "http://localhost:5000/mcp"

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"
