# Codex cannot read root `.mcp.json`. Keep this in lockstep with `.mcp.json`.

[mcp_servers.aspire]
command = "aspire"
args = ["agent", "mcp"]
startup_timeout_sec = 20.0
tool_timeout_sec = 120.0

[mcp_servers.dart]
command = "dart"
args = ["mcp-server"]
startup_timeout_sec = 20.0
tool_timeout_sec = 120.0

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"
startup_timeout_sec = 15.0
tool_timeout_sec = 60.0

[mcp_servers.context7]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 45.0
tool_timeout_sec = 90.0

[mcp_servers.context7.env]
CONTEXT7_API_KEY = "${CONTEXT7_API_KEY}"

[mcp_servers.codegraph]
command = "cmd"
args = ["/c", "npx", "-y", "@colbymchenry/codegraph@latest", "serve", "--mcp"]
startup_timeout_sec = 45.0
tool_timeout_sec = 120.0

[mcp_servers.digitalbrain-mcp]
url = "http://localhost:5000/mcp"
startup_timeout_sec = 15.0
tool_timeout_sec = 60.0

