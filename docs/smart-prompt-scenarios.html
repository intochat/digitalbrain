  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;smart-prompt-scenarios&quot; class=&quot;sp-shell&quot;&gt;
  &lt;style&gt;
    #smart-prompt-scenarios {
      --sp-bg: light-dark(#f6f6f7, #1c1c1f);
      --sp-panel: light-dark(#ffffff, #242428);
      --sp-panel-hover: light-dark(#f0f0f2, #2c2c31);
      --sp-text: light-dark(#202124, #f0f0f2);
      --sp-muted: light-dark(#666972, #a9abb4);
      --sp-line: light-dark(#dedee3, #3a3a42);
      --sp-blue: light-dark(#1769aa, #78b7ff);
      --sp-blue-bg: light-dark(#e7f2ff, #173552);
      --sp-purple: light-dark(#7047a8, #c8a7ff);
      --sp-purple-bg: light-dark(#f1e9fc, #38284e);
      --sp-green: light-dark(#276b43, #77d59b);
      --sp-green-bg: light-dark(#e7f7ed, #193b28);
      --sp-orange: light-dark(#92531d, #f3b36e);
      --sp-code: light-dark(#f7f7f9, #18181b);
      color-scheme: light dark;
      color: var(--sp-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      width: 100%;
    }

    #smart-prompt-scenarios * { box-sizing: border-box; }

    #smart-prompt-scenarios .sp-window {
      background: var(--sp-bg);
      border: 1px solid var(--sp-line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 44px color-mix(in srgb, var(--sp-text) 10%, transparent);
    }

    #smart-prompt-scenarios .sp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--sp-line);
    }

    #smart-prompt-scenarios .sp-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    #smart-prompt-scenarios .sp-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--sp-text);
      color: var(--sp-bg);
      font-weight: 500;
    }

    #smart-prompt-scenarios .sp-title {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    #smart-prompt-scenarios .sp-count {
      color: var(--sp-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    #smart-prompt-scenarios .sp-options {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      background: var(--sp-line);
      border-bottom: 1px solid var(--sp-line);
    }

    #smart-prompt-scenarios .sp-option {
      appearance: none;
      border: 0;
      border-radius: 0;
      background: var(--sp-panel);
      color: var(--sp-muted);
      min-height: 58px;
      padding: 9px 8px;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }

    #smart-prompt-scenarios .sp-option:hover { background: var(--sp-panel-hover); }
    #smart-prompt-scenarios .sp-option[aria-selected=&quot;true&quot;] {
      background: var(--sp-bg);
      color: var(--sp-text);
      box-shadow: inset 0 -3px 0 var(--sp-blue);
    }

    #smart-prompt-scenarios .sp-option-index {
      display: block;
      font-size: 11px;
      color: var(--sp-muted);
      margin-bottom: 3px;
    }

    #smart-prompt-scenarios .sp-option-name {
      display: block;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
    }

    #smart-prompt-scenarios .sp-main { padding: 22px; }

    #smart-prompt-scenarios .sp-prompt {
      margin: 0 0 16px;
      font-size: clamp(17px, 2.5vw, 23px);
      line-height: 1.72;
      letter-spacing: -0.018em;
    }

    #smart-prompt-scenarios .sp-token {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 2px 1px;
      padding: 2px 8px 3px;
      border-radius: 7px;
      font-size: 0.91em;
      line-height: 1.35;
      white-space: nowrap;
      vertical-align: baseline;
    }

    #smart-prompt-scenarios .sp-token-integration {
      color: var(--sp-blue);
      background: var(--sp-blue-bg);
    }

    #smart-prompt-scenarios .sp-token-data {
      color: var(--sp-purple);
      background: var(--sp-purple-bg);
    }

    #smart-prompt-scenarios .sp-token-safety {
      color: var(--sp-green);
      background: var(--sp-green-bg);
    }

    #smart-prompt-scenarios .sp-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--sp-muted);
      font-size: 12px;
      margin-bottom: 18px;
    }

    #smart-prompt-scenarios .sp-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #smart-prompt-scenarios .sp-dot {
      width: 8px;
      height: 8px;
      border-radius: 3px;
    }

    #smart-prompt-scenarios .sp-dot-integration { background: var(--sp-blue); }
    #smart-prompt-scenarios .sp-dot-data { background: var(--sp-purple); }
    #smart-prompt-scenarios .sp-dot-safety { background: var(--sp-green); }

    #smart-prompt-scenarios .sp-code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 13px;
      background: var(--sp-panel);
      border: 1px solid var(--sp-line);
      border-bottom: 0;
      border-radius: 11px 11px 0 0;
      color: var(--sp-muted);
      font-size: 12px;
    }

    #smart-prompt-scenarios .sp-recommended {
      color: var(--sp-green);
      font-weight: 500;
    }

    #smart-prompt-scenarios pre {
      margin: 0;
      padding: 17px 18px 20px;
      overflow-x: auto;
      background: var(--sp-code);
      border: 1px solid var(--sp-line);
      border-radius: 0 0 11px 11px;
      color: var(--sp-text);
      font: 13px/1.7 &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, monospace;
      white-space: pre;
    }

    #smart-prompt-scenarios .syn-keyword { color: var(--sp-purple); font-weight: 500; }
    #smart-prompt-scenarios .syn-domain { color: var(--sp-blue); }
    #smart-prompt-scenarios .syn-string { color: var(--sp-orange); }
    #smart-prompt-scenarios .syn-tag { color: var(--sp-green); }
    #smart-prompt-scenarios .syn-comment { color: var(--sp-muted); }

    @media (max-width: 720px) {
      #smart-prompt-scenarios .sp-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      #smart-prompt-scenarios .sp-option:last-child { grid-column: 1 / -1; }
      #smart-prompt-scenarios .sp-main { padding: 17px; }
      #smart-prompt-scenarios .sp-header { padding: 15px 17px; }
      #smart-prompt-scenarios pre { font-size: 12px; }
    }
  &lt;/style&gt;

  &lt;section class=&quot;sp-window&quot; aria-labelledby=&quot;sp-title&quot;&gt;
    &lt;header class=&quot;sp-header&quot;&gt;
      &lt;div class=&quot;sp-brand&quot;&gt;
        &lt;span class=&quot;sp-mark&quot; aria-hidden=&quot;true&quot;&gt;✦&lt;/span&gt;

    &lt;div class=&quot;sp-main&quot;&gt;
      &lt;p class=&quot;sp-prompt&quot; id=&quot;sp-prompt&quot;&gt;&lt;/p&gt;
      &lt;div class=&quot;sp-legend&quot; aria-label=&quot;Syntax legend&quot;&gt;

      &lt;/div&gt;
      &lt;div class=&quot;sp-code-header&quot;&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;smart-prompt-scenarios&#x27;);
      const optionsRoot = root.querySelector(&#x27;.sp-options&#x27;);
      const promptRoot = root.querySelector(&#x27;#sp-prompt&#x27;);
      const codeRoot = root.querySelector(&#x27;#sp-code&#x27;);
      const countRoot = root.querySelector(&#x27;#sp-count&#x27;);
      const nameRoot = root.querySelector(&#x27;#sp-scenario-name&#x27;);
      const recommendedRoot = root.querySelector(&#x27;#sp-recommended&#x27;);

      const scenarios = [
        {
          name: &#x27;Readable flow&#x27;,
          recommended: true,
          prompt: [
            [&#x27;text&#x27;, &#x27;When a new email arrives in &#x27;],
            [&#x27;integration&#x27;, &#x27;✉ Email&#x27;],
            [&#x27;data&#x27;, &#x27;vlad@intochat.io&#x27;],
            [&#x27;text&#x27;, &#x27; and contains company information, use &#x27;],
            [&#x27;integration&#x27;, &#x27;⌕ Web Research&#x27;],
            [&#x27;text&#x27;, &#x27; to prepare a sourced company profile, then create an &#x27;],
            [&#x27;safety&#x27;, &#x27;approval request&#x27;],

            [&#x27;integration&#x27;, &#x27;☁ Salesforce&#x27;],
            [&#x27;data&#x27;, &#x27;Account.Description&#x27;],
            [&#x27;text&#x27;, &#x27;.&#x27;]
          ],
          code: `Feature: Account enrichment

  @behavior
  Scenario: Enrich an account from a company email
    Given Email.Account(&quot;vlad@intochat.io&quot;)
    When a new Email is received
    And the Email contains Company.Info
    Then research Company.Info with WebResearch

  @test

          prompt: [

            [&#x27;data&#x27;, &#x27;New message&#x27;],
            [&#x27;text&#x27;, &#x27; → extract &#x27;],
            [&#x27;data&#x27;, &#x27;Company.Info&#x27;],
            [&#x27;text&#x27;, &#x27; → research with &#x27;],
            [&#x27;integration&#x27;, &#x27;⌕ Web Research&#x27;],
            [&#x27;text&#x27;, &#x27; → match one &#x27;],
            [&#x27;integration&#x27;, &#x27;☁ Salesforce&#x27;],
            [&#x27;data&#x27;, &#x27;Account&#x27;],
            [&#x27;text&#x27;, &#x27; → request approval for &#x27;],
            [&#x27;data&#x27;, &#x27;Description&#x27;],
            [&#x27;text&#x27;, &#x27;.&#x27;]
          ],
          code: `Feature: Account enrichment pipeline

  @behavior
  Scenario: Move company evidence from Email to Salesforce
    Given Email.Account(&quot;vlad@intochat.io&quot;)
    When a new Email is received
    And Company.Info can be extracted
    Then WebResearch researches the Company
    And Salesforce.Account matches exactly one Company
    And propose Salesforce.Account.Description from WebResearch.Results

  @test
  Scenario: The integration chain ends at approval
    Given fake Email to &quot;vlad@intochat.io&quot; with Company.Info &quot;Northstar Robotics&quot;

    And fake Salesforce has exactly one matching Account
    When behavior &quot;Move company evidence from Email to Salesforce&quot; runs

        },
        {
          name: &#x27;Account first&#x27;,
          prompt: [
            [&#x27;text&#x27;, &#x27;For company emails received by &#x27;],
            [&#x27;integration&#x27;, &#x27;✉ Email&#x27;],
            [&#x27;data&#x27;, &#x27;vlad@intochat.io&#x27;],
            [&#x27;text&#x27;, &#x27;, first find exactly one existing &#x27;],
            [&#x27;integration&#x27;, &#x27;☁ Salesforce&#x27;],
            [&#x27;data&#x27;, &#x27;Account&#x27;],
            [&#x27;text&#x27;, &#x27;; only then use &#x27;],
            [&#x27;integration&#x27;, &#x27;⌕ Web Research&#x27;],
            [&#x27;text&#x27;, &#x27; and propose a sourced Description update.&#x27;]
          ],
          code: `Feature: Existing account enrichment

  @behavior
  Scenario: Research only an existing Salesforce account
    Given Email.Account(&quot;vlad@intochat.io&quot;)
    When a new Email is received

    And propose Salesforce.Account.Description with Sources

  @test
  Scenario: An existing account receives a proposal
    Given fake Email contains Company.Info &quot;Northstar Robotics&quot;
    And fake Salesforce contains Account(&quot;Northstar Robotics&quot;)
    And fake WebResearch returns sourced Company.Profile
    When behavior &quot;Research only an existing Salesforce account&quot; runs

        },
        {
          name: &#x27;Guardrail first&#x27;,
          prompt: [
            [&#x27;text&#x27;, &#x27;When &#x27;],
            [&#x27;integration&#x27;, &#x27;✉ Email&#x27;],
            [&#x27;text&#x27;, &#x27; identifies a company, enrich only if &#x27;],
            [&#x27;integration&#x27;, &#x27;☁ Salesforce&#x27;],
            [&#x27;text&#x27;, &#x27; finds &#x27;],
            [&#x27;safety&#x27;, &#x27;exactly one Account&#x27;],
            [&#x27;text&#x27;, &#x27;; attach &#x27;],
            [&#x27;data&#x27;, &#x27;source URLs&#x27;],
            [&#x27;text&#x27;, &#x27; and require &#x27;],
            [&#x27;safety&#x27;, &#x27;human approval&#x27;],
            [&#x27;text&#x27;, &#x27;.&#x27;]
          ],
          code: `Feature: Guarded account enrichment

  @behavior
  Scenario: Refuse unsafe account enrichment
    Given Email.Account(&quot;vlad@intochat.io&quot;)
    When a new Email is received
    And the Email contains Company.Info
    Then require exactly one matching Salesforce.Account
    And require sourced WebResearch.Results
    And propose Salesforce.Account.Description for human approval

  @test
  Scenario: Ambiguous accounts stop before research and mutation

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  const handlePointerOpen = (event) =&gt; {

    }

    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;

    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    const trigger = getTrigger(event.target);

    }
  };
  const handleKeyDown = (event) =&gt; {

    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
