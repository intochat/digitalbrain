#digitalbrain-architecture .db-arrow span:last-child {

#digitalbrain-architecture .db-detail-grid div {

#digitalbrain-architecture .db-detail-grid span {
  color: var(--muted-foreground);
}

#digitalbrain-architecture .db-topology {
  display: grid;
  gap: 1rem;
}

#digitalbrain-architecture .db-processes {
  display: grid;

#digitalbrain-architecture .db-process {

#digitalbrain-architecture .db-process strong {

#digitalbrain-architecture .db-process span {
  color: var(--muted-foreground);

#digitalbrain-architecture .db-section-heading {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  align-items: baseline;
  justify-content: space-between;
}

#digitalbrain-architecture .db-table {
  width: 100%;

#digitalbrain-architecture .db-table th,

#digitalbrain-architecture .db-table button {

#digitalbrain-architecture .db-change-grid {

#digitalbrain-architecture .db-keep-symbol {

#digitalbrain-architecture .db-remove-symbol {

@media (max-width: 560px) {

@media (prefers-reduced-motion: reduce) {

        &lt;ul class=&quot;db-change-list&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;db-keep-symbol&quot;&gt;●&lt;/span&gt;&lt;span&gt;Flutter chat, auth, feed, and RFW SurfaceView&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;db-keep-symbol&quot;&gt;●&lt;/span&gt;&lt;span&gt;Conversation and bounded model workflow&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;db-keep-symbol&quot;&gt;●&lt;/span&gt;&lt;span&gt;Worker leases, fencing, reminders, retries, and outbox&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;db-keep-symbol&quot;&gt;●&lt;/span&gt;&lt;span&gt;Signed effect plans, approval evidence, and connector verification&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;db-keep-symbol&quot;&gt;●&lt;/span&gt;&lt;span&gt;Pulumi deployment and OpenTelemetry foundations&lt;/span&gt;&lt;/li&gt;

          &lt;li&gt;&lt;span class=&quot;db-remove-symbol&quot;&gt;×&lt;/span&gt;&lt;span&gt;Generic TestKit built on the deleted runtime&lt;/span&gt;&lt;/li&gt;

  &lt;div class=&quot;card db-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;db-detail-head&quot;&gt;
      &lt;strong id=&quot;db-detail-name&quot;&gt;Target architecture&lt;/strong&gt;
      &lt;span class=&quot;viz-badge&quot; id=&quot;db-detail-kind&quot;&gt;System&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;db-detail-purpose&quot;&gt;Integrations are shipped infrastructure packages. Features are source-first, BDD-verified, and hot-installed while DigitalBrain keeps running.&lt;/div&gt;
    &lt;div class=&quot;db-detail-grid text-small&quot;&gt;
      &lt;div&gt;&lt;span&gt;Trust boundary&lt;/span&gt;&lt;strong id=&quot;db-detail-trust&quot;&gt;RuntimeHost owns authority and credentials&lt;/strong&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;Depends on&lt;/span&gt;&lt;strong id=&quot;db-detail-deps&quot;&gt;Explicit contracts and durable state&lt;/strong&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span&gt;Restart behavior&lt;/span&gt;&lt;strong id=&quot;db-detail-restart&quot;&gt;Feature changes require no platform restart&lt;/strong&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;digitalbrain-architecture&quot;);
  const details = {
    flutter: [&quot;Flutter product UI&quot;, &quot;Experience&quot;, &quot;Chat, Feature authoring, approval, inspection, and server-driven surfaces.&quot;, &quot;Authenticated owner interaction&quot;, &quot;MCP/UI Edge and RFW contracts&quot;, &quot;No restart for Feature changes&quot;],
    edge: [&quot;MCP / UI Edge&quot;, &quot;Edge&quot;, &quot;Exposes MCP tools and transports live UI surfaces without owning business authority.&quot;, &quot;Authenticated external boundary&quot;, &quot;Orleans client and UI runtime&quot;, &quot;Long-lived process&quot;],
    source: [&quot;Feature source + BDD&quot;, &quot;Feature&quot;, &quot;Shareable C# implementation, Gherkin scenarios, and tests using the same template everywhere.&quot;, &quot;Owner-reviewed source&quot;, &quot;Features SDK and Integration Contracts&quot;, &quot;No restart&quot;],
    builder: [&quot;FeatureBuilder&quot;, &quot;Build&quot;, &quot;Restores only an offline allowlist, compiles, runs BDD, emits one immutable release, and exits.&quot;, &quot;No credentials, Orleans, storage, or unrestricted network&quot;, &quot;Bounded source snapshot and package feed&quot;, &quot;Transient process per build&quot;],
    release: [&quot;Feature Release&quot;, &quot;Artifact&quot;, &quot;Content-addressed assembly, derived manifest, scenario results, source reference, and digest.&quot;, &quot;Exact digest approved by owner&quot;, &quot;Successful FeatureBuilder run&quot;, &quot;Hot loaded without platform restart&quot;],
    featurehost: [&quot;FeatureHost&quot;, &quot;Execution&quot;, &quot;Loads releases into collectible contexts, claims inbox work, enforces run budgets, and buffers intents.&quot;, &quot;No provider credentials or direct external mutations&quot;, &quot;Orleans client, SDK, Contracts, releases&quot;, &quot;Normally hot updates; recycle only after failed unload&quot;],
    runtime: [&quot;RuntimeHost&quot;, &quot;Authority&quot;, &quot;Hosts Orleans grains, validates every capability operation, and owns Integration runtime wiring.&quot;, &quot;Credential and durable authority boundary&quot;, &quot;Orleans, Integrations, Azurite&quot;, &quot;Integration changes may restart affected hosts&quot;],
    hub: [&quot;FeatureHubGrain&quot;, &quot;Grain&quot;, &quot;Owns releases, installations, subscriptions, grants, dependencies, and durable fan-out cursor.&quot;, &quot;Partitioned by BrainOwnerId&quot;, &quot;grainstate and Integration events&quot;, &quot;Survives activation and host restarts&quot;],
    installation: [&quot;FeatureInstallationGrain&quot;, &quot;Grain&quot;, &quot;Owns inbox, schedules, Feature state, leases, fences, retries, completion ledger, and committed intents.&quot;, &quot;Owner plus installation authority&quot;, &quot;grainstate and FeatureHost&quot;, &quot;Survives activation and host restarts&quot;],
    dispatcher: [&quot;Capability dispatcher&quot;, &quot;Authority&quot;, &quot;Validates grants and routes Query, InternalWrite, and ExternalEffect operations by stable capability ID.&quot;, &quot;Server-side validation on every call&quot;, &quot;Installation, release digest, grant revision&quot;, &quot;Hosted with RuntimeHost&quot;],
    effectrail: [&quot;Effect authority rail&quot;, &quot;External effect&quot;, &quot;Signs proposals, captures approval or policy evidence, applies through a connector, and verifies outcomes.&quot;, &quot;Only path for observable external mutation&quot;, &quot;INO authority, worker, outbox, verifier&quot;, &quot;Retained correctness rail&quot;],
    googlecontracts: [&quot;Google Contracts&quot;, &quot;Integration contract&quot;, &quot;Narrow Gmail capabilities, DTOs, events, stable IDs, and safe metadata.&quot;, &quot;No credentials or provider SDK&quot;, &quot;BCL and approved serialization metadata&quot;, &quot;Version retained while active Features depend on it&quot;],
    google: [&quot;Google Runtime + Hosting&quot;, &quot;Integration runtime&quot;, &quot;Owns OAuth tokens, Gmail watches, event production, capability handlers, health, and hosting.&quot;, &quot;Provider credential boundary&quot;, &quot;Google Contracts and provider SDK&quot;, &quot;Ship or upgrade may restart affected hosts&quot;],
    salesforcecontracts: [&quot;Salesforce Contracts&quot;, &quot;Integration contract&quot;, &quot;Narrow record read and mutation-proposal capabilities with stable identifiers.&quot;, &quot;No credentials or provider SDK&quot;, &quot;BCL and approved serialization metadata&quot;, &quot;Version retained while active Features depend on it&quot;],
    salesforce: [&quot;Salesforce Runtime + Hosting&quot;, &quot;Integration runtime&quot;, &quot;Owns credentials, queries, mutation application, outcome verification, health, and hosting.&quot;, &quot;Provider credential boundary&quot;, &quot;Salesforce Contracts and provider SDK&quot;, &quot;Ship or upgrade may restart affected hosts&quot;],
    grainstate: [&quot;Orleans state&quot;, &quot;Storage&quot;, &quot;Persists clustering and grain authorities with explicit application writes.&quot;, &quot;Local/dev Azurite is disposable&quot;, &quot;Azure Tables and Blobs&quot;, &quot;Reloaded after process restart&quot;],
    artifacts: [&quot;Feature artifacts&quot;, &quot;Storage&quot;, &quot;Stores source snapshots and immutable release content addressed by digest.&quot;, &quot;Owner-scoped metadata and approved releases&quot;, &quot;Azurite blob resource&quot;, &quot;Reloaded by FeatureHost after restart&quot;],
    memoryfacts: [&quot;memoryfacts&quot;, &quot;Memory&quot;, &quot;Stores bounded facts and supports deterministic tag, token-overlap, and recency ranking.&quot;, &quot;Owner-only inspect, export, correct, and forget&quot;, &quot;Azure Table with ETags&quot;, &quot;No embeddings or vector service&quot;],
    system: [&quot;Target architecture&quot;, &quot;System&quot;, &quot;Integrations are shipped infrastructure packages. Features are source-first, BDD-verified, and hot-installed while DigitalBrain keeps running.&quot;, &quot;RuntimeHost owns authority and credentials&quot;, &quot;Explicit contracts and durable state&quot;, &quot;Feature changes require no platform restart&quot;]
  };
  const flowText = {
    overview: &quot;All target components&quot;,
    program: &quot;Intent → Gherkin → C# → isolated BDD build → digest approval → hot install&quot;,
    event: &quot;Gmail event → hub fan-out → installation inbox → Feature run → committed output&quot;,
    effect: &quot;Feature proposal → signed plan → approval → connector apply → verification → outcome event&quot;,
    update: &quot;Build new digest → stage → switch new work → drain old release → unload or recycle&quot;,
    memory: &quot;Feature recall/read → lexical ranking; remember → committed internal-write intent → ETag table write&quot;
  };
  const setDetail = id =&gt; {
    const item = details[id] || details.system;
    document.getElementById(&quot;db-detail-name&quot;).textContent = item[0];
    document.getElementById(&quot;db-detail-kind&quot;).textContent = item[1];
    document.getElementById(&quot;db-detail-purpose&quot;).textContent = item[2];
    document.getElementById(&quot;db-detail-trust&quot;).textContent = item[3];
    document.getElementById(&quot;db-detail-deps&quot;).textContent = item[4];
    document.getElementById(&quot;db-detail-restart&quot;).textContent = item[5];
    root.querySelectorAll(&quot;[data-node]&quot;).forEach(node =&gt; node.setAttribute(&quot;aria-pressed&quot;, String(node.dataset.node === id)));
  };
  const selectFlow = flow =&gt; {
    root.querySelectorAll(&quot;[data-flow-button]&quot;).forEach(button =&gt; {
      const selected = button.dataset.flowButton === flow;
      button.setAttribute(&quot;aria-pressed&quot;, String(selected));
      button.classList.toggle(&quot;btn-primary&quot;, selected);
    });
    root.querySelectorAll(&quot;[data-view=&#x27;map&#x27;] [data-node]&quot;).forEach(node =&gt; {
      const active = flow === &quot;overview&quot; || node.dataset.flows.split(&quot; &quot;).includes(flow);
      node.classList.toggle(&quot;is-dim&quot;, !active);
      node.classList.toggle(&quot;is-active&quot;, active &amp;&amp; flow !== &quot;overview&quot;);
    });
    const item = details.system;
    document.getElementById(&quot;db-detail-name&quot;).textContent = flow === &quot;overview&quot; ? item[0] : flowText[flow];
    document.getElementById(&quot;db-detail-kind&quot;).textContent = flow === &quot;overview&quot; ? item[1] : &quot;Flow&quot;;
    document.getElementById(&quot;db-detail-purpose&quot;).textContent = flowText[flow];
    document.getElementById(&quot;db-detail-trust&quot;).textContent = flow === &quot;effect&quot; ? &quot;External mutation remains behind approval and verification&quot; : &quot;Authority remains in RuntimeHost&quot;;
    document.getElementById(&quot;db-detail-deps&quot;).textContent = &quot;Durable IDs, explicit contracts, idempotent application&quot;;
    document.getElementById(&quot;db-detail-restart&quot;).textContent = flow === &quot;program&quot; || flow === &quot;update&quot; ? &quot;No platform restart on the normal path&quot; : &quot;Durable processing resumes after restart&quot;;
    root.querySelectorAll(&quot;[data-node]&quot;).forEach(node =&gt; node.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;));
  };
  const selectView = view =&gt; {
    root.querySelectorAll(&quot;[data-view]&quot;).forEach(section =&gt; section.hidden = section.dataset.view !== view);
    root.querySelectorAll(&quot;[data-view-button]&quot;).forEach(button =&gt; {
      const selected = button.dataset.viewButton === view;
      button.setAttribute(&quot;aria-pressed&quot;, String(selected));
      button.classList.toggle(&quot;btn-primary&quot;, selected);
    });
    root.querySelector(&quot;[data-flow-controls]&quot;).hidden = view !== &quot;map&quot;;
    setDetail(&quot;system&quot;);
  };
  root.querySelectorAll(&quot;[data-view-button]&quot;).forEach(button =&gt; button.addEventListener(&quot;click&quot;, () =&gt; selectView(button.dataset.viewButton)));
  root.querySelectorAll(&quot;[data-flow-button]&quot;).forEach(button =&gt; button.addEventListener(&quot;click&quot;, () =&gt; selectFlow(button.dataset.flowButton)));
  root.querySelectorAll(&quot;[data-node]&quot;).forEach(node =&gt; node.addEventListener(&quot;click&quot;, () =&gt; setDetail(node.dataset.node)));
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
