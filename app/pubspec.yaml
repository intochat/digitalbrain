name: digitalbrain_flutter
description: DigitalBrain Flutter client
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  grpc: ^5.1.0
  protobuf: ^6.0.0
  flutter_bloc: ^9.1.1
  go_router: ^17.2.0
  fixnum: ^1.1.1
  vector_math: ^2.2.0
  opentelemetry: ^0.18.11
  openid_client: ^0.4.10+1
  http: ^1.3.0
  clock: ^1.1.2

  cross_file: ^0.3.5+2
  desktop_drop: ^0.7.1

  file_picker: ^8.3.7
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0


  rfw: ^1.0.0
  graphic: ^2.7.0
  forui: ^0.21.3



  lottie: ^3.3.3
  flutter_earth_globe: ^2.2.1
  shared_preferences: ^2.5.5
  flutter_web_plugins:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  youtube_player_iframe: ^6.0.0
  markdraw: ^0.2.0
  simple_icons: 16.23.0
  digital_brain_sdk_flutter:
    path: packages/digital_brain_sdk_flutter

  widgetbook: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/ino-catalog.json
  shaders:
    - assets/shaders/glass_refract.frag
