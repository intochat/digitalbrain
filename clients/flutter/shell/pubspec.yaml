name: digitalbrain_flutter_shell
description: >
  Windows Material chrome for DigitalBrain OS surface. Depends on pure-Dart
  clients/flutter/core (package digitalbrain_flutter) for edge/projection only.
  Pixels only — never Orleans/MCP.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  digitalbrain_flutter:
    path: ../core
  flutter_chat_ui: ^2.11.1
  flutter_chat_core: ^2.9.0
  flyer_chat_text_message: ^2.6.0
  flyer_chat_text_stream_message: ^2.3.0
  uuid: ^4.6.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
