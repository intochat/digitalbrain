name: digitalbrain_flutter
description: >
  DigitalBrain OS surface host. Built: pure Dart edge client, SSE projection,
  headless host (bin/digitalbrain_host.dart). Designed: Flutter Windows chrome
  when Flutter SDK is on PATH. Never Orleans, never MCP-as-UI.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

executables:
  digitalbrain_host:

dependencies:
  digitalbrain_wire:
    path: ../digitalbrain_wire
  http: ^1.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
